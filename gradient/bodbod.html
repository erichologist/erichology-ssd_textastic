<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Premium Animated Hero</title><style>/* 1. GLOBAL SETTINGS & VARIABLES */:root {    --bg-dark: #191919;    --bg-accent: #353130;    --bg-bridge: #2a2a2a;    --text-main: #999;}html {    font-size: 2.2vw; /* Responsive fluid type */    margin: 0;    padding: 0;}/* 2. BODY & BACKGROUND LOGIC */body {    margin: 0;    min-height: 100vh;    width: 100%;    padding-inline: 1.5rem; /* Mobile breathing room */    box-sizing: border-box;    color: white; /* Assuming light text for dark bg */    font-family: sans-serif; /* Placeholder */    /* MULTI-LAYER GRADIENT */    background-image:         /* Top Layer: The Shimmer (Diagonal) */        linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 70%),        /* Bottom Layer: The 3-Color Flow (Looping back to start) */        linear-gradient(90deg, var(--bg-dark), var(--bg-accent), var(--bg-bridge), var(--bg-dark));    background-size: 200% 100%, 400% 100%;    background-attachment: fixed;    /* ANIMATIONS: Shimmer (8s) and Color Flow (15s) */    animation:         shimmer 8s infinite linear,         colorFlow 15s ease-in-out infinite;}/* 2. THE HERO CARD */.hero-card {    width: 100%;    max-width: 75ch; /* Desktop limit */    margin: 2.5vh auto;    padding: 4rem 2rem;    border-radius: 24px;    overflow: hidden;    position: relative;    box-sizing: border-box;    text-align: center;    /* Layered Animated Background */    background:rgba(255,255,255,0.04);    background-size: 200% 100%, 400% 100%;    background-attachment: fixed;    border:none;     box-shadow:inset 0 .2px 0 .4px rgba(255,255,255,0.15), 0 25px 50px -12px rgba(0, 0, 0, 0.5),inset 0 0 12px  rgba(255,255,255,0.2),inset 0 0 22px rgba(255,255,255,0.2);}/* 3. KEYFRAMES */@keyframes shimmer {    0% { background-position: -200% 0, 0 0; }    100% { background-position: 200% 0, 0 0; }}@keyframes colorFlow {    0% { background-position: 0 0, 0% 50%; }    50% { background-position: 0 0, 101% 50%; } /* 101% hides seams */    100% { background-position: 0 0, 0% 50%; }}@keyframes fadeInUp {    from { opacity: 0; transform: translateY(20px); }    to { opacity: 1; transform: translateY(0); }}/* 4. CONTENT STYLES */.fade-in-text {    opacity: 0;    animation: fadeInUp 0.8s ease-out forwards;    color: var(--text-main);}h1 {    font-size: 2.5rem;    margin-bottom: 1rem;    animation-delay: 0.2s;}p {    font-size: 1.1rem;    line-height: 1.6;    margin-bottom: 2rem;    opacity: 0.8;    animation-delay: 0.5s;}button.cta-button {    display: inline-block;    padding: 0.8rem 2.5rem;    background: rgba(255, 255, 255, 0.1);    color: white;    text-decoration: none;    border-radius: 50px;    border: 1px solid rgba(255, 255, 255, 0);    font-weight: 600;    backdrop-filter: blur(10px);    -webkit-backdrop-filter: blur(10px);    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);    opacity: 0;    animation: fadeInUp 0.8s ease-out forwards;    animation-delay: 0.8s;    background:rgba(255,255,255,0.04);    animation-delay: 1s; /* Appears last */    border:none;     box-shadow:inset 0 .2px 0 .4px rgba(255,255,255,0.015), 0 25px 50px -12px rgba(0, 0, 0, 0.5),inset 0 0 12px  rgba(255,255,255,0.01),inset 0 0 22px rgba(255,255,255,0.01);    animation: fadeInUp 0.8s ease-out forwards;}button.cta-button:active,button.cta-button:hover {    background: rgba(255, 255, 255, 0.1);    box-shadow:inset 0 10px 20px rgba(0,0,0,0.3),inset 0 -2px 4px rgba(0,0,0,0.15), 0 25px 50px -12px rgba(0, 0, 0, 0.5),inset 0 0 12px rgba(0,0,0,0.01),inset 0 0 22px rgba(0,0,0,0.01);    border-color: rgba(255, 255, 255, 0);}button.cta-button:first-child:active,button.cta-button:first-child:hover {transform: translateY(3px), scale(0.95);}button.cta-button:nth-child(2):active,button.cta-button:nth-child(2):hover {transform: translateY(3px), scale(0.95);}/* Removes outline for mouse users, keeps it for keyboard users */button:focus,button:focus:not(:focus-visible) {    outline: none;    border: none;}/* 4. RESPONSIVE BREAKPOINTS *//* Tablet/Desktop: Cap the width for readability */@media screen and (min-width: 1000px) {html { font-size: 24px;}    body {        max-width: 75ch;        margin-inline: auto; /* Centers the layout */    }  /* Mobile: Ensure font is legible */  @media screen and (max-width: 520px) {      html { font-size: 16px; }      h1 { font-size: 1.8rem; }      .hero-card { padding: 3rem 1.5rem; }  }}    </style></head><body>    <section class="hero-card">        <h1 class="fade-in-text">Experience the Flow</h1>        <p class="fade-in-text">            This card uses a 75ch max-width for perfect readability on desktop,             while staying fully responsive on mobile devices.        </p>        <a href="#" class="cta-button">Get Started</a>        <a href="#" class="cta-button">Get Started</a>    </section><section class="hero-card">    <h1 class="fade-in-text delay-1">Experience the Flow</h1>    <p class="fade-in-text delay-2">        This section uses a contained animated gradient with a subtle shimmer         and staggered text entry.    </p></section></body></html>
