<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{  background-color: #505050;}
.background--custom {
  background-color: #746E6C;
  background-color: #443E3C;
  width: 800vw;
  height: 100vh;
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: -2;
  top: 0;
  left: 0;

mix-blend-mode:difference;
  overflow: hidden;
}
canvas#canvas {
  z-index: -1;
  position: absolute;
/*
mix-blend-mode:difference;*
	mix-blend-mode:exclusion;
  
  width:110%;
  height:110%;*/
  min-height:110vh;
  left:-80%;
  top: -30%;
  transform:rotate(90deg) scale(1.2, .8);
  transform:rotate(70deg) scale(.8, 1.2);
  --gradient-color-1: #9E9E9E; 
  --gradient-color-2: #9E9E9E; 
  --gradient-color-3: #746E6C;  
  --gradient-color-4: #746E6C;

  --gradient-color-1: #9E9E9EAA; 
  --gradient-color-2: #4F4D4D; 
  --gradient-color-3: #F6F3F3;  
  --gradient-color-4: #746E6C;
  --gradient-speed: 0.00000584219999999999999998;
  mix-blend-mode:exclusion;

}
</style>

</head>
<body>
<div class="background--custom"><canvas id="canvas" /></div>

<script src="./minigl.js"></script>
<script>
var gradient = new Gradient();
gradient.initGradient("#canvas");
</script>
</body>
</html>
