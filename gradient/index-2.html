<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
.background--custom {
  background-color: #111;
  width: 100vw;
  height: 100vh;
  position: absolute;
  overflow: hidden;
  z-index: -2;
  top: 0;
  left: 0;
}
canvas#canvas {
  z-index: -1;
  position: absolute;
  width: 100%;
  height: 60%;
  transform: rotate(0) scale(1) translateY(0);
  --gradient-color-1: #bcc22e; 
  --gradient-color-2: #356cdf; 
  --gradient-color-3: #214012;  
  --gradient-color-4: #c578ee;
  --gradient-speed: 0.000019999999999999998;
}
</style>
</head>
<body>
<div class="background--custom">
  <canvas id="canvas" />
</div>
<script src="./minigl.js"></script>
<script>
var gradient = new Gradient();
gradient.initGradient("#canvas");
</script>
</body>
</html>
