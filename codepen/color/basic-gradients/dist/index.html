<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Basic Gradients</title>
<link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel="stylesheet" href="./style.css">
<style>
html {background-color: #202020;}
.gradient-examples {
  display:grid;
  gap:1rem;
  grid-template-rows:repeat(3, 1fr);
  margin:auto;
  max-height:250px;
  max-width:800px;
  padding:1rem;
}
/*@media (min-width:600px) {
	.gradient-examples {
		grid-template-columns:repeat(3, 1fr);
	}
}*/
.example {
	
	align-items:center;
	border-radius:16px;
	box-shadow:0 0 15px hsla(0deg, 0%, 0%, 0.5);
	color: #ddd;
	font-size:1.25rem;
	font-weight:900;
	display:flex;
	height:250px;
	justify-content:center;
	text-shadow:0 2px 3px hsla(0deg, 0%, 0%, 0.25);
margin-top:auto;;
	display: flex; 
	flex-direction:column;
	flex-direction:row;
	justify-content:space-evenly;
	justify-content:space-around;
	justify-content:space-between;
	flex-wrap:wrap;
	align-self:stretch;
	align-items:stretch;
	align-items:flex-end;	
	align-items:center;
}

.pklinear {background-image:linear-gradient(#FF8A00, #E52E71);}
.pkradial {background-image:radial-gradient(#FF8A00, #E52E71);}
.pkconic {background-image:conic-gradient(#FF8A00,#E52E71);}
.grnlinear {background-image:linear-gradient(var(--cyx), var(--dbl));}
.grnradial {background-image:radial-gradient(var(--cyx), var(--dbl));}
.grnconic {background-image:conic-gradient(var(--cyx), var(--dbl));}
.gb2linear {background-image:linear-gradient(var(--db3), var(--cyx));}
.gb2radial {background-image:radial-gradient(var(--db3), var(--cyx));}
.gb2conic {background-image:conic-gradient(
    var(--db4),
    var(--db3),
    var(--cyx),
    var(--cyx)
  );}
</style>

</head>
<body>


<div class="parent">
    <div class="div1">1</div>

    
<div class="gradient-examples">
	<div class="example pklinear">Linear Gradient</div>
	<div class="example pkradial">Radial Gradient</div>
	<div class="example pkconic">Conic Gradient</div>
</div>

<div class="gradient-examples">
	<div class="example grnlinear">Linear Gradient</div>
	<div class="example grnradial">Radial Gradient</div>
	<div class="example grnconic">Conic Gradient</div>
</div>

<div class="gradient-examples">
	<div class="example gb2linear">Linear Gradient</div>
	<div class="example gb2radial">Radial Gradient</div>
	<div class="example gb2conic">Conic Gradient</div>
</div>

</div>




</body>
</html>
