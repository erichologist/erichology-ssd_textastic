<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Responsive Table</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js" type="text/javascript"></script>

<link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<style>

.rwdinln { margin:1em 0;min-width:300px; }
.rwdinln tr { border-top:1px solid #ddd;border-bottom:1px solid #ddd; }
.rwdinln th { display:none; }
.rwdinln td { display:block; }
.rwdinln td:first-child { padding-top:0.5em; }
.rwdinln td:last-child { padding-bottom:0.5em; }
.rwdinln td:before { content:attr(data-th) ":";font-weight:bold;width:6.5em;display:inline-block; }@media (min-width:480px) { 
.rwdinln td:before { display:none; } }
.rwdinln th,
.rwdinln td { text-align:left; }@media (min-width:480px) { 
.rwdinln th, 
.rwdinln td { display:table-cell;padding:0.25em 0.5em; }
.rwdinln th:first-child, 
.rwdinln td:first-child { padding-left:0; }
.rwdinln th:last-child, 
.rwdinln td:last-child { padding-right:0; } }body { padding:0 2em;font-family:Montserrat,sans-serif;letter-spacing:-0.5px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color:#ddd;background:#191919; }h1 { font-weight:normal;letter-spacing:-2px;color:#f46; }
.rwdinln { background-image:repeating-linear-gradient(#1a1430,#393473);color:#fff;border-radius:0.4em;overflow:hidden; }
.rwdinln tr { border-color:#46637f; }
.rwdinln th,
.rwdinln td { border:conic-gradient(#ff8a00,#e52e71,#ff8a00) solid 5px;margin:0.5em 1em; }@media (min-width:480px) { 
.rwdinln th, 
.rwdinln td { padding:1em !important; } }
.rwdinln th,
.rwdinln td:before { border:conic-gradient(#ff8a00,#e52e71,#ff8a00) solid 5px;color:#d55;border-width:3px;border-color:overlay(#fff,100%); }
</style>
</head>
<body>
<!-- partial:index.partial.html -->
<h1>RWD List to Table</h1>
<table class="rwd-table">
	<tr>
		<th>Movie Title</th>
		<th>Genre</th>
		<th>Year</th>
		<th>Gross</th>
	</tr>
	<tr>
		<td data-th="Movie Title">Star Wars</td>
		<td data-th="Genre">Adventure, Sci-fi</td>
		<td data-th="Year">1977</td>
		<td data-th="Gross">$460,935,665</td>
	</tr>
	<tr>
		<td data-th="Movie Title">Howard The Duck</td>
		<td data-th="Genre">"Comedy"</td>
		<td data-th="Year">1986</td>
		<td data-th="Gross">$16,295,774</td>
	</tr>
	<tr>
		<td data-th="Movie Title">American Graffiti</td>
		<td data-th="Genre">Comedy, Drama</td>
		<td data-th="Year">1973</td>
		<td data-th="Gross">$115,000,000</td>
	</tr>
</table>
