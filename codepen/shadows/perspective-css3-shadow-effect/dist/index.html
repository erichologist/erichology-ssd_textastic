<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Perspective CSS3 Shadow Effect</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">

  
        <div class="drop-shadow perspective">
            <p>Perspective shadow</p>
        </div>
  
        <div class="drop-shadow lifted">
            <p>Lifted corners shadow</p>
        </div>

        <div class="drop-shadow curled">
            <p>Curled corners shadow</p>
        </div>

        <div class="drop-shadow raised">
            <p>Raised box shadow</p>
        </div>

        <div class="drop-shadow curved curved-vt-1">
            <p>Single vertical curve shadow</p>
        </div>

        <div class="drop-shadow curved curved-vt-2">
            <p>Vertical curves shadow</p>
        </div>

        <div class="drop-shadow curved curved-hz-1">
            <p>Single horizontal curve shadow</p>
        </div>

        <div class="drop-shadow curved curved-hz-2">
            <p>Horizontal curves shadow</p>
        </div>

        <div class="drop-shadow lifted rotated">
            <p>Rotated box shadow</p>
        </div>
    </div>
    
  </body>
  
</html>
