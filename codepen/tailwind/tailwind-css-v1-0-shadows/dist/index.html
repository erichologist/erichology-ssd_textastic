<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Tailwind CSS v1.0 Shadows</title>
    <link rel='stylesheet' href='https://unpkg.com/tailwindcss@0.7.4/dist/tailwind.min.css'><link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="text-sm text-grey-darker font-sans min-h-screen bg-grey-light flex items-center justify-around">
  <div class="s1 bg-white rounded shadow flex items-center justify-center">
    .shadow
  </div>
  <div class="s2 bg-white rounded shadow-md flex items-center justify-center">
    .shadow-md
  </div>
  <div class="s3 bg-white rounded shadow-lg flex items-center justify-center">
    .shadow-lg
  </div>
  <div class="s4 bg-white rounded shadow-xl flex items-center justify-center">
    .shadow-xl
  </div>
  <div class="s5 bg-white rounded shadow-2xl flex items-center justify-center">
    .shadow-2xl
  </div>
</div>
    
  </body>
  
</html>
