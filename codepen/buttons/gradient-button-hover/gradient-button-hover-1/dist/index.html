<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title> Gradient Button Hover</title>
    <link rel="stylesheet" href="style.css">
<style>body,html{
background-color: #222;
}</style>
  </head>
    
  <body>
  <div class="buttons">
    <button class="btn-hover color-1"><span class="a">Button 1</span></button>
    <button class="btn-hover color-2"><span class="a">Button 2</span></button>
    <button class="btn-hover color-3"><span style="text-shadow: -1px -1px 12px rgba(0,0,20,0.4), 1px 1px 10px rgba(200,200,220,0.10), -2px -2px 15px 0 rgba(190, 190, 193, 0.12), 1px 1px 12px rgba(0,0,20,0.12) !important;" class="a">Button 3</span></button>
    <button class="btn-hover color-4"><span class="a">Button 4</span></button>
    <button class="btn-hover color-5"><span class="a">Button 5</span></button>
    <button class="btn-hover color-6"><span class="a">Button 6</span></button>
    <button class="btn-hover color-7"><span class="a">Button 7</span></button>
    <button class="btn-hover color-8"><span class="a">Button 8</span></button>
    <button class="btn-hover color-9"><span class="a">Button 9</span></button>
    <button class="btn-hover color-10"><span class="a">Button 10</span></button>
    <button class="btn-hover color-11"><span class="a">Button 11</span></button>
</div>
    
</body>
  
</html>
