<!DOCTYPE HTML><html><head>  <meta charset="utf-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">  <title>Buttons, Hover Effects | Codepens </title><link rel="stylesheet" type="text/css" media="all" href="../../assets/mdmd.css" /><style>/************************************GRADIENT BUTTONS <link rel="stylesheet" type="text/css" media="all" href="../../assets/markdown3.css" /><link rel="stylesheet" type="text/css" media="all" href="../../assets/prism.css" /><script type="text/javascript" src="../../assets/prism.js"></script><link rel="stylesheet" type="text/css" media="all" href="../../assets/markdown3.css" /><link rel="stylesheet" type="text/css" media="all" href="../../1. css/mdmd.css" />/****************CLIP-PATH EFFECTS****************** */html{	width:100%;/*	height:100%;*/	margin:0;}/* base styles that to be applied to every button */button{	font-size:20px;	padding:10px 30px;	margin:10px;	border:0;	box-shadow:0 2px 5px rgba(0,0,0,0.3);	cursor:pointer;	color:#181819;	text-transform:lowercase;	border-radius:10px;	display:inline-block;	overflow:hidden;	transition:all 0.4s cubic-bezier(.86,.01,.15,.99);	transition:all 0.8s cubic-bezier(.86,.01,.15,.99);}button::before{	content:"";	position:absolute;	z-index:-1;	top:0px;	left:0px;	right:0px;	bottom:0;}/* all gradient buttons will translate upwards on hover */button.grdnt:hover{	color:white;	box-shadow:0 5px 35px rgba(0,0,0,0.4);	transform:translateY(-5px);}button.grdnt-y:hover{	color:white;	box-shadow:0 5px 35px rgba(0,0,0,0.4);	transform:translateY(5px);}/***********************GRADIENT BUTTONS  Button One-B */.btn1-b{	background-color:#f9ff00;	background-color:#8F8300;	opacity:1;	transform:translateY(0);}.btn1-c::before.btn1-b::before{	/*background:linear-gradient(to right, #f9ff00,#00ff00);	background:linear-gradient(to right, #f9ff0080 #00ff0080);*/	background:linear-gradient(to bottom, #C3C600,#8F8300);	-webkit-transform:scaleY(0);	transform:scaleX(0);	-webkit-transform-origin:50% 100%;	transform-origin:100% 0%;	transition:0.4s cubic-bezier(.86,.01,.15,.99);	opacity:1;}.btn1-b:hover::before{	transform:scaleX(1.1) scaleY(1.1);}.btn1-b:hover{	color:#333300;}.btn1-c::before{	/*background:linear-gradient(to right, #f9ff00,#00ff00);	background:linear-gradient(to right, #f9ff0080 #00ff0080);*/	background:linear-gradient(to bottom, #C3C600,#8F8300);	-webkit-transform:scaleY(0);	transform:scaleX(0);	-webkit-transform-origin:50% 100%;	transform-origin:100% 0%;	transition:0.4s cubic-bezier(.86,.01,.15,.99);	opacity:1;}.btn1-c:hover::before{	transform:scaleX(-1.1) scaleY(-1.1);}.btn1-c:hover{	color:#333300;}/* Button Two-B */.btn2-c,.btn2-b{	background:#efcfff; 	background:#efcfff80;	transform:perspective(1px) translateZ(0);	transition:0.4s cubic-bezier(.86,.01,.15,.99);}.btn2-b:before{	background:linear-gradient(to right, #efcfff, #af6fff, #efcfff);	background:linear-gradient(to right, #efcfff80,#af6fff80,#efcfff80);	transform:scaleX(0);	opacity:0;	transform-origin:50% 50%;	transition:0.4s cubic-bezier(.86,.01,.15,.99);}.btn2-c:hover:before{	transform:scaleX(-1) scaleY(-1);	opacity:1;}.btn2-c:before{	background:linear-gradient(to right, #efcfff, #af6fff, #efcfff);	background:linear-gradient(to right, #efcfff80,#af6fff80,#efcfff80);	transform:scaleX(0);	opacity:0;	transform-origin:50% 50%;	transition:0.4s cubic-bezier(.86,.01,.15,.99);}.btn2-c:hover:before{	transform:scaleX(-1) scaleY(-1);	opacity:1;}/* Button Three-B */.btn3-b{	-webkit-transform:perspective(1px) translateZ(0);	background:#08aa61;	background:#08aa6180;	transform:perspective(1px) translateZ(0);	position:relative;	transition-timing-function:cubic-bezier(.86,.01,.15,.99);	transition-duration:0.4s;}.btn3-b:before{	background:linear-gradient(to bottom, #88daa1,#08aa61);	background:linear-gradient(to bottom, #88daa180,#08aa6180);	transform:scaleY(0);	transform-origin:0% 0%;	transition:0.4s cubic-bezier(.86,.01,.15,.99);}.btn3-b:hover:before{	-webkit-transform:scaleY(1);	transform:scaleY(1);}.btn3-c:before{	background:linear-gradient(to bottom, #88daa1,#08aa61);	background:linear-gradient(to bottom, #88daa180,#08aa6180);	transform:scaleX(0);	transform-origin:0% 0%;	transition:0.4s cubic-bezier(.86,.01,.15,.99);}.btn3-c:hover:before{	-webkit-transform:scaleX(1);	transform:scaleX(1);}.btn3-d:before{	background:linear-gradient(to bottom, #88daa1,#08aa61);	background:linear-gradient(to bottom, #88daa180,#08aa6180);	transform:scaleY(0);	transform-origin:0% 0%;	transition:0.4s cubic-bezier(.86,.01,.15,.99);}.btn3-d:hover:before{	-webkit-transform:scaleY(-1);	transform:scaleY(-1);}/******************CLIP-PATH EFFECTS Button Four-B */.btn4-b{	/*background:#fff;*/	background:rgba(255,255,255,0.2);	transform:perspective(1px) translateZ(0);	color:#222C;	color:#CCCC;	transition:0.4s;}.btn4-b::before{	background:rgba(255,60,90,0.2);	background:rgb(255,60,90);	clip-path:inset(0 100% 0 0);	opacity:1;	transition:0.4s;}.btn4-b:hover::before{	clip-path:inset(0 0 0 0);}.btn4-b:hover{	color:white;	box-shadow:0 0 0 10px rgba(30,30,45,0.5);	box-shadow:0 0 0 10px rgba(250,250,250,0.1)}/* -•-•-•-•-•-•- */.btn4-b{	/*background:#fff;*/	background:rgba(255,255,255,0.2);	transform:perspective(1px) translateZ(0);	color:#222C;	color:#CCCC;	transition:0.4s;}.btn4-b::before{	background:rgba(255,60,90,0.2);	background:rgb(255,60,90);	clip-path:inset(0 100% 0 0);	opacity:1;	transition:0.4s;}.btn4-b:hover::before{	clip-path:inset(0 0 0 0);}.btn4-b:hover{	color:white;	box-shadow:0 0 0 10px rgba(30,30,45,0.5);	box-shadow:0 0 0 10px rgba(250,250,250,.9)}/* -•-•-•-•-•-•- */.btn4-c{	/*background:#fff;*/	background:rgba(255,255,255,0.2);	background:rgb(255,60,90);	background:rgba(255,60,90,0.7);	transform:perspective(1px) translateZ(0);	color:#222C;	color:#AAAC;	transition:0.4s;}.btn4-c::before{	background:rgba(255,60,90,0.2);	background:rgb(255,60,90);	clip-path:inset(100% 0 0 0);	opacity:1;	transition:0.4s;}.btn4-c:hover::before{	clip-path:inset(0 0 0 0);}.btn4-c:hover{	color:white;	box-shadow:0 0 0 10px rgba(30,30,45,0.5);	box-shadow:0 0 0 10px rgba(250,250,250,0.1)}/* Button Five-B */.btn5-b{	/*background:white;*/	background:rgba(255,255,255,0.2);	color:#AAAC;	color:#222C;	color:#CCCC;	transform:perspective(1px) translateZ(0);	transition:0.4s;}.btn5-b::before{	background:rgba(255,255,255,0.2);	background:rgb(20,120,255);	clip-path:polygon(50% 0,50% 0,50% 50%, 50% 100%, 50% 100%, 50% 50%);	opacity:1;	transition:0.4s;}.btn5-b:hover::before{	clip-path:polygon(25% -70%, 75% -70%, 120% 50%, 75% 170%, 25% 170%, -20% 50%);}.btn5-b:hover{	color:white;	box-shadow:0 0 0 10px rgba(250,250,250,0.91)}/* Button Six-B */.btn6-b{	background:rgba(255,255,255,0.2);	color:#222C;	color:#AAAC;	transition:0.4s;	transform:perspective(1px) translateZ(0);}.btn6-b:hover{	color:white;	box-shadow:0 0 0 10px rgba(250,250,250,0.9)}.btn6-b::before{	clip-path:circle(0.5% at 50% 50%);	background:#9900cc;	transition:0.4s;	opacity:1;}.btn6-b:hover::before{	clip-path:circle(100% at 50% 50%);}/**********************/* some extra styles */*{	margin:0;	color:#ddd;}.body{    margin:1em;    margin-right:1em;    margin-left:1em;	  opacity:1 !important;}body{	background:#222232;	display:flex;	flex-direction:column;	justify-content:space-evenly;	align-items:center;	/*font-family:-apple-system, system-ui, sans-serif;*/	/*height:100vh;*/	width:100vw;}div.container{	margin:1em;	padding:20px;	border-radius:20px;	background:rgba(255,255,255,0.05);	border:1px solid rgba(255,255,255,0.0);	border:none;}.container{	margin:1em;	text-align:center;}.contrhr{	/*margin-left:0.25em;	margin-right:0.25em;	padding-left:2px;	padding-right:2px;*/	margin
