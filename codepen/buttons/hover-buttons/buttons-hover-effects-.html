<!DOCTYPE HTML><html><head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>Buttons, Hover Effects | Codepens </title><link rel="stylesheet" type="text/css" media="all" href="../../assets/prism.css" /><script type="text/javascript" src="../../assets/prism.js"></script><link rel="stylesheet" type="text/css" media="all" href="../../assets/mdmd.css" /><style>:root{  --bg-qt:rgb(255,255,255,0.15);	--bd-qt:1px solid rgb(255,255,255,0.2);	--bdbt-qt:1px solid rgb(255,255,255,0.05);	--br:10px;	--sh-qt:0 4px 16px rgb(0,0,0,0.1),inset 0 2px 8px rgb(255,255,255,0.152);}blockquote:not(:has(>blockquote)) {	background:rgb(255,255,255,0.1);	border:1px solid rgb(255,255,255,0.2);	border-bottom:1px solid rgb(255,255,255,0.05);	border-radius:10px;	box-shadow:0 4px 16px rgb(0,0,0,0.1),inset 0 2px 8px rgb(255,255,255,0.152);	color:#bbb;	font-family:var(--font-text);	font-size:1.015rem;	font-size:0.98rem;	letter-spacing:var(--lsp05);	line-height: calc(var(--line-height) * 0.95);	line-height: calc(var(--line-height) * 1);	padding-right:1.75rem;	padding-top:0.76rem;	padding-bottom:0.37rem;	padding-left:2rem;	margin-left:calc(var(--quote-indent) * 1rem);	margin-right:calc(var(--quote-indent) * 1rem);	margin-bottom:1rem;	text-indent:var(--quote-indent);	z-index: -13;}html {    width: 100%;    height: 100%;    margin: 0;}* {	margin: 0;	color: #eee;}body {	background: #222232;	/*height: 100vh;*/	width: 90vw;	margin:2.6em 1.4em;  	display: flex;	flex-direction: column;	justify-content: space-evenly;	align-items: center;	font-family: -apple-system, system-ui, sans-serif;}div.container {	margin: 2em;	padding:2.6em 1.4em;	border-radius: 20px;	/*background: rgba(255, 255, 255, 0.05);	border: 1px solid rgba(255, 255, 255, 0.1);*/  background:var(--bg-qt);  background-color:var(--bg-qt);  border:var(--bd-qt);  border-bottom:var(--bdbt-qt);  box-shadow:var(--sh-qt);}.container {	text-align: center;}h1 {	font-size: 50px;}p {	font-size: 25px;	font-style: italic;	border-radius: 20px;	margin-bottom: 20px;}hr {	border: 0;	background: rgba(255, 255, 255, 0.2);	margin: 10px;	height: 1px;}/* some base styles to be applied to every button */button {	font-size: 30px;	padding: 10px 30px;	margin: 10px;	border: 0;	cursor: pointer;	color: black;	text-transform: lowercase;	border-radius: 10px;	display: inline-block;	overflow: hidden;	transition: all 0.4s cubic-bezier(.86, .01, .15, .99);}button::before {	content: "";	position: absolute;	z-index: -1;	top: 0px;	left: 0px;	right: 0px;	bottom: 0;}/* every gradient button will translate upwards on hover */button.gradient:hover {	color: white;	box-shadow: 0 5px 35px rgba(0, 0, 0, 0.6);	transform: translateY(-5px);}/************************************GRADIENT BUTTONS Button One  */.button-one {	background-color: #f9ff00;	transform: translateY(0);}.button-one::before {	background: linear-gradient(to right, #f9ff00, #00ff00);	-webkit-transform: scaleY(0);	transform: scaleX(0);	-webkit-transform-origin: 50% 100%;	transform-origin: 100% 0%;	transition: 0.4s cubic-bezier(.86, .01, .15, .99);}.button-one:hover::before {	transform: scaleX(1.1) scaleY(1.1);}.button-one:hover {	color: #333;}/* Button Two */.button-two {	background: #efcfff;	transform: perspective(1px) translateZ(0);	transition: 0.4s cubic-bezier(.86, .01, .15, .99);}.button-two:before {	background: linear-gradient(to right, #efcfff, #af6fff, #efcfff);	transform: scaleX(0);	opacity: 0;	transform-origin: 50% 50%;	transition: 0.4s cubic-bezier(.86, .01, .15, .99);}.button-two:hover:before {	transform: scaleX(1) scaleY(1);	opacity: 1;}/* Button Three */.button-three {	-webkit-transform: perspective(1px) translateZ(0);	background: #08aa61;	transform: perspective(1px) translateZ(0);	position: relative;	transition-timing-function: cubic-bezier(.86, .01, .15, .99);	transition-duration: 0.3s;}.button-three:before {	background: linear-gradient(to bottom, #88daa1, #08aa61);	transform: scaleY(0);	transform-origin: 0% 0%;	transition: 0.4s cubic-bezier(.86, .01, .15, .99);}.button-three:hover:before {	-webkit-transform: scaleY(1);	transform: scaleY(1);}/****************CLIP-PATH EFFECTS/*Button Four */.button-four {	background: #fff;	transform: perspective(1px) translateZ(0);	color: black;	transition: 0.4s;}.button-four::before {	background: rgb(255, 90, 20);	clip-path: inset(0 100% 0 0);	opacity: 1;	transition: 0.4s;}.button-four:hover::before {	clip-path: inset(0 0 0 0);}.button-four:hover {	color: white;	box-shadow: 0 0 0 10px rgba(250, 250, 250, 0.1);}/* Button Five */.button-five {	background: rgba(250, 250, 250, 0.3);	color: black;	transform: perspective(1px) translateZ(0);	transition: 0.4s;}.button-five::before {	background: rgb(20, 120, 255);	clip-path: polygon(50% 0, 50% 0, 50% 50%, 50% 100%, 50% 100%, 50% 50%);	opacity: 1;	transition: 0.4s;}.button-five:hover::before {	clip-path: polygon(25% -70%, 75% -70%, 120% 50%, 75% 170%, 25% 170%, -20% 50%);}.button-five:hover {	color: white;	box-shadow: 0 0 0 10px rgba(250, 250, 250, 0.1)}/* Button Six */.button-six {	background:rgba(255,255,255,0.27);	color: black;	box-shadow:inset 0 0 5px rgba(255, 255, 255, 0.51);	transition: 0.4s;	transform: perspective(1px) translateZ(0);}.button-six:hover {	color: #00EAFF;	box-shadow:inset 0 0 10px rgba(255, 255, 255, 0.51);}.button-six::before {	clip-path: circle(0.5% at 50% 50%);	background: #9900ccCC;  background: #111C;	transition: 0.4s;	opacity: .8;}.button-six:hover::before {	clip-path: circle(100% at 50% 50%);  	box-shadow:inset 0 0 5px rgba(255, 255, 255, 0.51);	box-shadow:  inset 1px 1px 10px rgba(255, 255, 255, 0.21),  inset 0 0 20px rgb(0, 0, 0),  inset -1px -1px 5px rgba(0, 0, 0, 1);  }/* just some extra styles */</style></head><body>    <div>        <h1>CSS Button Hover Effects</h1>        <p>            with the :before pseudo-element        </p>        <div class="container">            <p>                Gradient            </p>            <button class="button-one gradient">btn 1 gradient</button>            <button class="button-two gradient">btn 2 gradient</button>            <button class="button-three gradient">btn 3 gradient</button>            <hr>            <p>                Clip-Path            </p>            <button class="button-four clip-path">Hover</button>            <button class="button-five clip-path">Hover</button>            <button class="button-six clip-path">Hover</button>        </div>    </div></body></html><!-- 33DDB4B0-8A73-458E-8CEB-335DF89A039D -->
