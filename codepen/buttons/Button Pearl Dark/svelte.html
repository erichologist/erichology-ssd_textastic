<!DOCTYPE HTML><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"><link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico"><link rel="icon" type="image/png" href="../../assets/icons/favicon.png"><link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg"><link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png"><link rel="manifest" href="../../assets/icons/site.webmanifest"><meta name="apple-mobile-web-app-title" content="erichology"><title>Dark Pearl Button | Demos</title><link rel="stylesheet" type="text/css" media="all" href="../../tailwind.min.css"/><link rel="stylesheet" href="https://use.typekit.net/txm5wvi.css"><link rel="stylesheet" href="https://use.typekit.net/ygj7fsw.css"><style>.sud { font-family: "sudz-regular",sans-serif; }.sudz { font-family: "sudz-black",sans-serif; }.wipe { font-family: "puffin-arcade-wipe",sans-serif; }.regular { font-family: "puffin-arcade-regular",sans-serif; }.tate { font-family: "puffin-arcade-tate",sans-serif; }.level { font-family: "puffin-arcade-level",sans-serif; }.liquid { font-family: "puffin-arcade-liquid",sans-serif; }.yoko { font-family: "puffin-arcade-yoko",sans-serif; }.dither { font-family: "puffin-arcade-dither",sans-serif; }.loadout { font-family: "puffin-arcade-loadout",sans-serif; }.nerf { font-family: "puffin-arcade-nerf",sans-serif; }.warp { font-family: "puffin-arcade-warp",sans-serif; }.foozle { font-family: "puffin-arcade-foozle",sans-serif; }.chrome { font-family: "puffin-arcade-chrome",sans-serif; }body {    background:rgb(31,41,55);    background-color:rgb(31,41,55);    color: #f9f9e3;		min-width:100%;		min-height:200vh;		}  .button {    --white: #ffe7ff;    --bg: #080808;    --radius: 100px;    outline: none;    cursor: pointer;    border: 0;    position: relative;    border-radius: var(--radius);    background-color: var(--bg);    transition: all 0.2s ease;    box-shadow:      inset 0 0.3rem 0.9rem rgba(255, 255, 255, 0.3),      inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.7),      inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.5),      0 3rem 3rem rgba(0, 0, 0, 0.3),      0 1rem 1rem -0.6rem rgba(0, 0, 0, 0.8);  }  .button .wrap {    font-size: 25px;    font-weight: 500;    color: rgba(255, 255, 255, 0.7);    padding: 32px 45px;    border-radius: inherit;    position: relative;    overflow: hidden;  }  .button .wrap p span {    opacity:0;  }	.button:hover .wrap p span:nth-child(1),.button:hover .wrap p span:nth-child(2) {	opacity:0;}	.button .wrap p {	display: flex;	align-items: center;	gap: 12px;	margin: 0;	transition: all 0.2s ease;	transform: translateY(2%);	mask-image:		linear-gradient(			to bottom, 			white 40%, 			transparent		);}.button .wrap::before,.button .wrap::after {	content: "";	position: absolute;	transition:all 5.3s ease;}.button .wrap::before {	left: -15%;	right: -15%;	bottom: 25%;	top: -100%;	border-radius: 50%;	background-color:		rgba(255, 255, 255, 0.12);}.button .wrap::after {	left: 6%;	right: 6%;	top: 12%;	bottom: 40%;	border-radius: 50%  50% 0 0;	border-radius:22px 22px 0 0;	border-radius:32px 32px 0 0;	border-radius:38px 38px 0 0;	border-radius:40px 40px 0 0;	box-shadow:inset 0 10px 8px -10px 		rgba(255, 255, 255, 0.8);	background: linear-gradient(		180deg,		rgba(255, 255, 255, 0.3) 0%,		rgba(0, 0, 0, 0) 50%,		rgba(0, 0, 0, 0) 100%	);}.button:hover {box-shadow:	inset 0 0.3rem 0.5rem rgba(255, 255, 255, 0.4),	inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.7),	inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.7),	0 3rem 3rem rgba(0, 0, 0, 0.3),	0 1rem 1rem -0.6rem rgba(0, 0, 0, 0.8);}.button:hover .wrap::before:hover {	transform: translateY(-5%);	opacity: 1;	left: -15%;	right: -15%;	bottom: 25%;	top: -100%;	border-radius: 50%;	-webkit-tap-highlight-color: transparent !important;}.button:hover .wrap::after {	opacity: 0.4;	transform: translateY(5%);}.button:hover .wrap p {	transform: translateY(-4%);}.button:active {	transform: translateY(4px);	box-shadow:	inset 0 0.3rem 0.5rem rgba(255, 255, 255, 0.5),	inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.8),	inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.4),	0 3rem 3rem rgba(0, 0, 0, 0.3),	0 1rem 1rem -0.6rem rgba(0, 0, 0, 0.8);}.buff {margin:1vh 5rem;}.buff {margin:5vh; padding:auto;}h1 {font-size:clamp(2.5rem, 6vw + 2rem, 12rem);}h1,h2{margin:auto auto 2rem 2rem;	text-shadow:		0 1px 8px rgba(0, 0, 0, 0.33),		0 0 4px rgba(0, 0, 0, 0.28);	font-family:Pragmata;	font-family:"sudz-regular",sans-serif;	font-weight:normal;	font-style:normal;	text-transform: uppercase;	letter-spacing:.08ch;}h1+:is(h1,h2) {margin-top:0;}h1:has(+h1,+h2) {margin-bottom:0;line-height:.1;margin-top:11%;}.buff .button .wrap p:has(>span),p:has(>span) {	font-family:"puffin-arcade-nerf",sans-serif;	font-size:80%;	word-spacing:.01ch;	letter-spacing:.22ch;	padding:5px;}.buff .button .wrap p>:is(span){padding:0; margin:0; word-spacing:-10%; letter-spacing:-10%; }.buff .button .wrap p span:nth-child(1){ font-family:"puffin-arcade-nerf",sans-serif; }.buff .button .wrap p span:nth-child(2){ font-family:"puffin-arcade-nerf",sans-serif; }.buff .button .wrap p span:nth-child(1):hover,.buff .button .wrap p span:nth-child(1):active{ font-family: "puffin-arcade-nerf",sans-serif; }.buff .button .wrap p span:nth-child(2):hover,.buff .button .wrap p span:nth-child(2):active { font-family:"puffin-arcade-nerf",sans-serif; }.button:hover .wrap p span:nth-child(2),.button .wrap p span:nth-child(2),.button:hover .wrap p span:nth-child(1),.button:hover .wrap p span:nth-child(2),.button .wrap::after,.button .wrap::before,.button .wrap::after,.button:hover,.button:active,.button:hover .wrap::before,.button:hover .wrap p,.button .wrap p span,h1:has(+h2), h1, h2,.buff, .button, .wrap, .button .wrap,button, input, div, span, p { -webkit-tap-highlight-color: transparent !important; }</style></head><body><h1>Dark Pearl</h1><h1>Button</h1><h2>Demos</h2><div class="buff"><button class="button"><div class="wrap"><p><span>*</span>Pearl Button<span>*</span></p></div></button><script src="./pearlbutton.js"></script></div></button></div>    <script src="react.development.js"></script>    <script src="./react-dom.development.js"></script>    <!-- Don't use this in production: -->    <script src="./babel.min.js"></script>    <script src="./pearlbutton.js"></script></body></html>
