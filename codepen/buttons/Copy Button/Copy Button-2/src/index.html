<h1>Copy Text Button</h1>
<p>Click the "Copy" button to copy the text within the input field</p>
<div class="form-group">
  <label for="test1">Test</label>
  <div class="input-group input-group-copy">
    <span class="input-group-btn">
      <button class="btn btn-default">Copy</button>
    </span>
    <input id="test1" type="text" readonly class="form-control" value="Copy this text first"/>
  </div>
</div>

<div class="form-group">
  <label for="test2">Test 2</label>
  <div class="input-group input-group-copy">
    <span class="input-group-btn">
      <button class="btn btn-default">Copy</button>
    </span>
    <input id="test2" type="text" readonly class="form-control" value="Copy this text second"/>
  </div>
</div>
