<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Copy Button</title>
    <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel='stylesheet' href='https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css'>
<link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <h1>Copy Text Button</h1>
<p>Click the "Copy" button to copy the text within the input field</p>
<div class="form-group">
  <label for="test1">Test</label>
  <div class="input-group input-group-copy">
    <span class="input-group-btn">
      <button class="btn btn-default">Copy</button>
    </span>
    <input id="test1" type="text" readonly class="form-control" value="Copy this text first"/>
  </div>
</div>

<div class="form-group">
  <label for="test2">Test 2</label>
  <div class="input-group input-group-copy">
    <span class="input-group-btn">
      <button class="btn btn-default">Copy</button>
    </span>
    <input id="test2" type="text" readonly class="form-control" value="Copy this text second"/>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
