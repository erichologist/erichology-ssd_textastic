<html><head><style>.hidden {  opacity: 0;}#three {   content: "<button>copy</button>\n<p id="one">first</p>\n<button>copy</button>\n<p id="two">second</p>";}</style><script>function copy_to_clipboard( elm_id ) {    var text = document.getElementById( elm_id ).innerHTML;    navigator.clipboard.writeText( text );  }document.addEventListener('click', e => {  if (e.target.matches('button') && e.target.nextElementSibling?.matches('p'))    navigator.clipboard.writeText(e.target.nextElementSibling.textContent)      .then(() => console.log('copied text'), error => console.error('failed to copy', error));});</script></head><body><script> document.addEventListener('click', e => {  if (e.target.matches('button') && e.target.nextElementSibling?.matches('p'))    navigator.clipboard.writeText(e.target.nextElementSibling.textContent)      .then(() => console.log('copied text'), error => console.error('failed to copy', error));});<button onclick="copy_to_clipboard('one')">copy first</button>   <p id="one">first</p>   <button onclick="copy_to_clipboard('two')">copy second</button>   <p id="two">second</p>   <button onclick="copy_to_clipboard('three')">copy third</button>   <p id="three">&lt;button>copy&lt;/button&gt;\n&lt;p id="one"&gt;first&lt;/p&gt;\n&lt;button&gt;copy&lt;/button>\n<p id=&quot;two&quot;&gt;second&lt;/p&gt;</p>   </script><button>copy</button><p id="one">first</p><button>copy</button><p id="two">second</p><button>copy</button><p class="hidden" id="three">&lt;button&gt;copy&lt;/button&gt;   &lt;p id="one"&gt;first&lt;/p&gt;   &lt;button&gt;copy&lt;/button&gt;&lt;p id=&quot;two&quot;&gt;second&lt;/p&gt;</p></body></html>
