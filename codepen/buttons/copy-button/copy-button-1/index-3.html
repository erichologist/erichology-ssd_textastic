<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Copy to Clipboard</title></head><body>    <p id="textToCopy">This is the text you want to copy.</p>    <button onclick="copyText()">Copy Text</button><script>function copyText() {   const textElement = document.getElementById('textToCopy');         const text = textElement.innerText;         navigator.clipboard.writeText(text)            .then(() => {               alert('Text copied to clipboard!');            })            .catch(err => {               console.error('Failed to copy text: ', err);               alert('Failed to copy text.');            });         }</script></body></html>
