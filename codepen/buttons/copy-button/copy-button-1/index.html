<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Copy to Clipboard</title>    <style>        body {            background-color: #181818;            font-family: Arial, sans-serif;            display: flex;            flex-direction: column;            align-items: center;            justify-content: center;            min-height: 100vh;            margin: 0;        }        #textToCopy {            border: 1px solid #ccc;            padding: 10px;            margin-bottom: 15px;            background-color: #fff;            width: 300px;            text-align: center;        }        button {            padding: 10px 20px;            font-size: 16px;            cursor: pointer;            background-color: #007bff;            color: white;            border: none;            border-radius: 5px;            transition: background-color 0.3s ease;        }        button:hover {            background-color: #0056b3;        }        .hidden {           opacity: 0;        }    </style></head><body>    <div class="hidden" id="textToCopy">This is the text you want to copy!</div>    <button onclick="copyText()">Copy Text</button><script>function copyText() {   const textElement = document.getElementById('textToCopy');   const textToCopy = textElement.innerText;   navigator.clipboard.writeText(textToCopy)   .then(() => {      alert('Text copied to clipboard!');   })   .catch(err => {      console.error('Failed to copy text: ', err);      alert('Failed to copy text. Please try again or copy manually.');   });}</script></body></html>
