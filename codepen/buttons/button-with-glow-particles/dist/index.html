<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Button with glow &amp; particles ✨</title>
    <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel='stylesheet' href='https://codepen.io/LukyVj/pen/JjavKEX/ca2344eb8511404c494dd71d1ca8f1a7.css'><link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <main>
  <button aria-label="Say Hello">
    <div>
      <span class="inner">
        <div class="particles" aria-hidden="true"></div>
        <span class="text">Say hello</span>
        <span class="halo" aria-hidden="true"></span>
      </span>
    </div>
    <span class="shadow" aria-hidden="true"></span>
  </button>
</main>


<div id="info-box" data-info-chrome="Rendering in Chrome" data-info-safari="Rendering in Safari" data-info-firefox="Rendering in Firefox" data-presentation-width="50vw" data-presentation-height="50vh" data-inspiration="https://twitter.com/adrienrochet/status/1642127496823930882" data-hidden-onLoad="false"></div>
    <script src='https://codepen.io/LukyVj/pen/JjavKEX/ca2344eb8511404c494dd71d1ca8f1a7.js'></script>
<script src='https://codepen.io/LukyVj/pen/jOeEZrQ/97f158d15ac9db4bd8badab8d8698689.js'></script><script  src="./script.js"></script>

  </body>
  
</html>
