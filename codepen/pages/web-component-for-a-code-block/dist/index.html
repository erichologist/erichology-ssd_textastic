<!DOCTYPE html>
<html lang="en" class="dank">

  <head>
    <meta charset="UTF-8">
    <title>Web Component for a Code Block</title>
    <link rel='stylesheet' href='https://use.typekit.net/aor8qev.css'>
<link rel='stylesheet' href='https://github.com/erichologist/assets/raw/refs/heads/main/fonts/dankmono/otf/italicstyle.css'>
<link rel='stylesheet' href='https://github.com/erichologist/assets/raw/refs/heads/main/fonts/dankmono/ttf/italicstyle.css'><link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <code-block class="language-css line-numbers" data-line="2">
  <pre class="">
html {
  --brandColor: red;
  background: var(--brandColor);
}
body {
  text-rendering: optimizeSpeed;
  height: 100vh;
  margin: 0;
  line-height: 1.6;
  font-family: "Georgia", serif !important;
}
</pre>
</code-block>

<code-block class="language-html line-numbers" data-line="2">
  <pre>
&lt;div class="card">
  &lt;h2>Cool.&lt;/h2>
&lt;/div
</pre>
</code-block>

<code-block class="language-javascript line-numbers" data-line="2">
  <pre>
const name = "Chris Coyier";
console.log(name);
</pre>
</code-block>

<template id="code-block-template">
  <style>
    pre[class*="language-"] {
      background: #222;
      color: white;
      font-family: monospace;
      font-size: 120%;
      text-align: left;
      white-space: pre;
      word-spacing: normal;
      word-break: normal;
      word-wrap: normal;
      line-height: 1.6;
      -moz-tab-size: 2;
      -o-tab-size: 2;
      tab-size: 2;
      -webkit-hyphens: none;
      -moz-hyphens: none;
      -ms-hyphens: none;
      hyphens: none;
      border-radius: .5em;
      margin: .5em 0;
      overflow: auto;
      padding: 1em;
    }

    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata {
      color: hsl(0, 0%, 47%);
    }

    .token.punctuation {
      opacity: .74;
    }

    .token.namespace {
      opacity: .7;
    }

    .token.deleted {
      color: red;
    }

    .token.tag,
    .token.boolean,
    .token.numbers,
    .language-css .token.number,
    .language-html .token.number,
    .language-css .token.numbers,
    .language-html .token.numbers,
    .style .token.number,
    .style .token.numbers,
    .token.operator,
    .language-html .token.numbers,
    .token.number {
      /*color: hsl(14, 58%, 55%); /* #CF6A4C */
      /*color: var(--cf6a4cc);
  color: var(--purple1);
  color: var(--yellow1);*/
      color: var(--yellow2);
      /*color: var(--yellow3);
  color: var(--yellow4);*/
    }

    .token.builtin,
    .token.keyword,
    .token.constant,
    .token.symbol {
      color: var(--8f9d6ab);
    }

    .token.property {
      /*color: hsl(53, 89%, 79%); /* #F9EE98 */
      /*color: var(--7587a6b);*/
      color: var(--cf6a4cb);
      color: var(--f5f2f0b);
      color: #FFF423;
      /*yellow*/
    }

    .language-css .token.property {
      color: var(--f5f2f0b);
      color: #F0EDEA;
      /* white */
    }

    .language-css .token.string,
    .token.string {
      color: var(--blue1);
      color: hsla(309, 77%, 42%, 1.0);
      color: #B5179E;
      color: #F72585;
    }

    .token.selector {
      color: #B5179E;
      color: #0CBBEA;
      color: var(--coral2);
      color: #FA2D6C;
    }

    .token.entity {
      color: var(--8f9d6ab);
    }

    .style .token.char,
    .style .token.char,
    .style .token.character,
    .token.character {
      color: #89FF00;
    }

    .language-html .token.variable,
    .language-javascript .token.variable,
    .language-json .token.variable,
    .language-markup .token.variable,
    .language-css .token.variable,
    .style .token.variable,
    .token.variable {
      color: #C678DD;
    }

    .style .token.string,
    .token.attr-name,
    .token.attr-value,
    .token.url,
    .style .token.string,
    .token.inserted {
      /*color: hsl(76, 21%, 52%); /* #8F9D6A */
      color: var(--8f9d6ab);
      /* #8F9D6A */
      color: var(--8f9d6ac);
      color: var(--8f9d6ad);
      color: var(--8f9d6ab);
      /*cyan4*/
      color: var(--cyan4);
      /*cyan4*/
      color: var(--8f9d6ac);
    }

    .token.atrule {
      /*color: hsl(218, 22%, 55%); /* #7587A6 */
      color: var(--7587a6d);
    }

    .token.regex,
    .token.important {
      /*color: hsl(42, 75%, 65%); /* #E9C062 */
      color: var(--e9c062d);
    }

    .token.important,
    .token.bold {
      font-weight: bold;
    }

    .token.italic {
      font-style: italic;
    }

    .token.entity {
      cursor: help;
    }

    /* Markup */
    .language-markup .token.tag,
    .language-markup .token.attr-name {
      /*color: hsl(33, 33%, 52%); /* #ac885b */
      color: var(--ac885bb);
    }

    .language-markup .token.punctuation,
    .language-css .token.punctuation {
      color: var(--yellow1);
    }

    .style .token.punctuation,
    .language-json .token.punctuation,
    .language-js .token.punctuation,
    .language-java .token.punctuation,
    .language-bsh .token.punctuation,
    .language-svg .token.punctuation,
    .language-javascript .token.punctuation {
      color: #89FF00;
    }

    .token.punctuation,
    .language-html .token.punctuation {
      color: var(--cyan1);
      color: #00FFD3;
    }

    /* Make the tokens sit above the line highlight so the colours don't look faded. */
    .token {
      position: relative;
      z-index: 1;
    }

    .line-highlight {
      background: hsla(0, 0%, 33%, 0.25);
      /* #545454 */
      background: linear-gradient(to right, hsla(0, 0%, 33%, .1) 70%, hsla(0, 0%, 33%, 0));
      /* #545454 */
      border-bottom: 1px dashed hsl(0, 0%, 33%);
      /* #545454 */
      border-top: 1px dashed hsl(0, 0%, 33%);
      /* #545454 */
      left: 0;
      line-height: inherit;
      margin-top: 0.75em;
      /* Same as .prism’s padding-top */
      padding: inherit 0;
      pointer-events: none;
      position: absolute;
      right: 0;
      white-space: pre;
      z-index: 0;
    }

    .line-highlight:before,
    .line-highlight[data-end]:after {
      background-color: hsl(215, 15%, 59%);
      /* #8794A6 */
      border-radius: 999px;
      box-shadow: 0 1px white;
      color: hsl(24, 20%, 95%);
      /* #F5F2F0 */
      content: attr(data-start);
      font: bold 65%/1.5 sans-serif;
      left: .6em;
      min-width: 1em;
      padding: 0 .5em;
      position: absolute;
      text-align: center;
      text-shadow: none;
      top: .4em;
      vertical-align: .3em;
    }

    .line-highlight[data-end]:after {
      bottom: .4em;
      content: attr(data-end);
      top: auto;
    }

    pre[data-line] {
      position: relative;
      padding: 1em 0 1em 3em;
    }

    .line-highlight {
      position: absolute;
      left: 0;
      right: 0;
      padding: inherit 0;
      margin-top: 1em;
      /* Same as .prism’s padding-top */
      background: hsla(24, 20%, 50%, .08);
      background: linear-gradient(to right, hsla(24, 20%, 50%, .1) 70%, hsla(24, 20%, 50%, 0));
      pointer-events: none;
      line-height: inherit;
      white-space: pre;
    }

    .line-highlight:before,
    .line-highlight[data-end]:after {
      content: attr(data-start);
      position: absolute;
      top: .4em;
      left: .6em;
      min-width: 1em;
      padding: 0 .5em;
      background-color: hsla(24, 20%, 50%, .4);
      color: hsl(24, 20%, 95%);
      font: bold 65%/1.5 sans-serif;
      text-align: center;
      vertical-align: .3em;
      border-radius: 999px;
      text-shadow: none;
      box-shadow: 0 1px white;
    }

    .line-highlight[data-end]:after {
      content: attr(data-end);
      top: auto;
      bottom: .4em;
    }

    .line-numbers .line-highlight:before,
    .line-numbers .line-highlight:after {
      content: none;
    }

    pre[class*="language-"].line-numbers {
      position: relative;
      padding-left: 3.8em;
      counter-reset: linenumber;
    }

    pre[class*="language-"].line-numbers>code {
      position: relative;
      white-space: inherit;
    }

    .line-numbers .line-numbers-rows {
      position: absolute;
      pointer-events: none;
      top: -0.13em;
      /* wtf */
      left: -3.8em;
      width: 3em;
      /* works for line-numbers below 1000 lines */
      border-right: 1px solid #999;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .line-numbers-rows>span {
      pointer-events: none;
      display: block;
      counter-increment: linenumber;
    }

    .line-numbers-rows>span::before {
      content: counter(linenumber);
      color: #999;
      display: block;
      padding-right: 0.8em;
      text-align: right;
    }

    #copy-button {
      position: absolute;
      top: 5px;
      right: 5px;
    }
  </style>
</template>
    <script src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/3/prism-for-wc.js'></script><script  src="./script.js"></script>

  </body>
  
</html>
