<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>mix-blend-mode Blockquote Demo</title><style>body {  font-family: system-ui, sans-serif;  margin: 2em;  background: url('https://picsum.photos/800/600?grayscale') center/cover no-repeat;  color: black;}.qq,blockquote {  position: relative;  padding: 1.5em 2em;  margin: 2em 0;  font-size: 1.2em;  font-style: italic;  background: rgba(255, 255, 255, .08);  mix-blend-mode:overlay;  border-left: 6px solid #FFF;  backdrop-filter: blur(34px);  color: #009;}blockquote {  width: 60%;  padding: 2rem;  font-size: 1.5rem;  font-style: italic;  background-color: rgba(255, 255, 255, 0.08);  mix-blend-mode: lighten;  mix-blend-mode:hard-light;  mix-blend-mode:overlay;  border-left: 8px solid #fff;  backdrop-filter:blur(18px) url(#blockquote) saturate(150%);  -webkit-backdrop-filter:blur(48px) saturate(150%);  backdrop-filter: blur(34px);  -webkit-backdrop-filter:blur(38px);}blockquote footer {  display: block;  margin-top: 1em;  font-size: 0.9em;  text-align: right;  opacity: 0.8;}    footer {      margin-top: 1rem;      font-size: 1rem;      text-align: right;      opacity: 0.8;    }  </style></head><body>  <blockquote>    “Design is not just what it looks like and feels like. Design is how it works.”    <footer>— Steve Jobs</footer>  </blockquote><!--  <blockquote><p>The mix-blend-mode property accepts several values, including (but not limited to):<dl><dt>normal:</dt><dd>The default value; no blending occurs.</dd><dt>multiply:</dt><dd>The colors of the element and its backdrop are multiplied, typically resulting in a darker color. White becomes transparent, and black remains black.</dd><dt>screen: </dt><dd>Multiplies the complements of the colors, resulting in a lighter color. Black becomes transparent, and white remains white.</dd></dl></blockquote>--></body></html><!-- CF6E24AA-369A-4D11-B615-F87696C80803 -->
