<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Glass Login</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <html lang="es">
<head>
  <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="k3ch0o" data-description="Support me on Buy me a coffee!" data-message="☕" data-color="#fff" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glass Login</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <audio id="bg-music" src="https://cdn.pixabay.com/audio/2022/03/15/audio_e8404fca2e.mp3" autoplay loop></audio>

  <button class="music-toggle" onclick="toggleMusic()">
    <i data-lucide="volume-2" id="music-icon"></i>
  </button>

  <div class="bokeh-background">
    <div class="bokeh b1"></div>
    <div class="bokeh b2"></div>
    <div class="bokeh b3"></div>
    <div class="bokeh b4"></div>
    <div class="bokeh b5"></div>
    <div class="bokeh b6"></div>
    <div class="bokeh b7"></div>
  </div>

  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <form>
      <div class="input-group">
        <i data-lucide="mail"></i>
        <input type="email" placeholder="Correo electrónico" required>
      </div>
      <div class="input-group">
        <i data-lucide="lock"></i>
        <input type="password" placeholder="Contraseña" required>
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
