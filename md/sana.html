<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Liquid Glass + Swirl Preview</title><style>/* ----------------------------------------------------   1. CSS VARIABLES---------------------------------------------------- */:root {  /* Neutral gradient tones */  --swirl-gray-1: #3a3a3a;  --swirl-gray-2: #2a2a2a;  --swirl-gray-1: #4a4a4a;  --swirl-gray-2: #2a2a2a;  /* Opacity + intensity */  --swirl-opacity-min: 0.25;  --swirl-opacity-max: 0.45;  /* Motion timing */  --swirl-move-duration: 18s;  --swirl-pulse-duration: 6s;  /* Glass panel colors */  --glass-bg: rgba(255, 255, 255, 0.06);  --glass-border: rgba(255, 255, 255, 0.12);  --glass-inner-glow: rgba(255, 255, 255, 0.06);  /* Sheen highlight */  --sheen-light-1: rgba(255, 255, 255, 0.18);  --sheen-light-2: rgba(255, 255, 255, 0.28);  --sheen-opacity: 0.25;  --sheen-duration: 6s;  /* Blur + radius */  --glass-blur: 22px;  --glass-radius: 20px;  /* Blend-mode overlays */  --overlay-vignette-opacity: 0.35;  --overlay-light-opacity: 0.25;  --overlay-noise-opacity: 0.12;  --overlay-light-color: rgba(255, 255, 255, 0.15);  --overlay-vignette-color: rgba(0, 0, 0, 0.8);  --overlay-noise-img: url("data:image/svg+xml;utf8,\<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'>\<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/></filter>\<rect width='100%' height='100%' filter='url(#n)'/>\</svg>");	--bg-accent:#464342;	--bg-bridge:#363332;	--bg-dark:	#222020;	--hdmgnl:		 -2.75%;	--bg-dark:#14121280;	--bg-accent:#46434480;	--bg-bridge:#2D2C2C80;	--line-height:1.5;	--ln-ht:1.5;	--text-main:#ffffff;	--fnt-b:'Monotalic-Narrow', 'Monotalic-NarrowLight', 'DicoMono-Script', 'DicoMono-BoldScript', 'DicoTypewriter-Script', 'SymbolsNFM', monospace;	--fnt:'Monotalic-NarrowLight', 'Monotalic-Narrow', 'DicoMono-Script', 'DicoMono-BoldScript', 'DicoTypewriter-Script', 'SymbolsNFM', monospace;	--font-txt:var(--fnt);}*, body {	margin-top:0;	margin-bottom:0;}* + * {margin-top:calc(var(--ln-ht) * .5rem);}/*html {	width:100%;	margin:0;}*/li+li, li ul, li ol {margin-top:0;}li p:last-of-type {margin-bottom:calc(var(--ln-ht) * .25rem);}h1+p, h2+p, h3+p, h4+p, h5+p, h6+p {	font-family:var(--font-txt);	margin-top:0;}p+h1, p+h2, p+h3, p+h4, p+h5, p+h6 {	margin-top:.5em;}h1+span, h2+span, h3+span, h4+span, h5+span, h6+span {	font-family:var(--font-txt);	margin-top:0;}/*  1. ROOT & FONT SCALING  =========== ====================================== */html {    font-size: 2.2vw; /* Responsive fluid type */    margin: 0;    padding: 0;}/*  2. BODY & BACKGROUND LOGIC  ======= ====================================== *//*body::before {	margin:0;	padding:0;	font-family:var(--fnt);	display:flex;	align-items:center;	justify-content:center;	min-height:100vh;	background-color:#14121222;	background-image:	  linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 70%),	  linear-gradient(90deg, var(--bg-drk), var(--bg-accent), var(--bg-bridge), var(--bg-dark));	background-size: 200% 100%, 400% 100%;	background-size: 400% 200%, 600% 200%;	background-attachment:fixed;	mix-blend-mode:overlay;	-webkit-mix-blend-mode:overlay;	animation: 		bshimmer 8s infinite linear, 		bcolorFlow 15s ease-in-out infinite;	-webkit-animation:		bshimmer 8s infinite linear, 		bcolorFlow 15s ease-in-out infinite;	-moz-animation: 		bshimmer 8s infinite linear, 		bcolorFlow 15s ease-in-out infinite;}*/body {	margin:0;	padding:0;	background:none;	background-color:#14121222;	font-family:var(--fnt);	display:flex;	align-items:center;	justify-content:center;	min-height:100vh;	background-image:	  linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 70%),	  linear-gradient(90deg, var(--bg-drk), var(--bg-accent), var(--bg-bridge), var(--bg-dark));	background-size: 200% 100%, 400% 100%;	background-size: 400% 200%, 600% 200%;	background-attachment:fixed;	mix-blend-mode:exclude;	-webkit-mix-blend-mode:exclude;	animation: 		bshimmer 8s infinite linear, 		colorFlow 15s ease-in-out infinite;	-webkit-animation:		bshimmer 8s infinite linear, 		colorFlow 15s ease-in-out infinite;	-moz-animation: 		bshimmer 8s infinite linear, 		colorFlow 15s ease-in-out infinite;}/*  3. KEYFRAMES  ============ =========================== */@keyframes shimmer {	0% { background-position:-200% 0, 0 0; }	100% { background-position:200% 0, 0 0; }}@keyframes colorFlow {	0% { background-position:0 0, 0% 50%; }	50% { background-position:0 0, 101% 50%; }	/*101% hides the seam*/	100% { background-position:0 0, 0% 50%; }}@keyframes bshimmer {	0% { background-position:200% 0, 0 0; }	100% { background-position:-200% 0, 0 0; }}@keyframes bcolorFlow {	0% { background-position:0 0, 0% 50%; }	50% { background-position:0 0, -101% 50%; }	/*101% hides the seam*/	100% { background-position:0 0, 0% 50%; }}/*@-webkit-keyframes shimmer {	0% { background-position:-200% 0, 0 0; }	100% { background-position:200% 0, 0 0; }}@-webkit-keyframes colorFlow {	0% { background-position:0 0, 0% 50%; }	50% { background-position:0 0, 101% 50%; }	/*101% hides the seam*/	/*100% { background-position:0 0, 0% 50%; }}@-moz-keyframes shimmer {	0% { background-position:-200% 0, 0 0; }	100% { background-position:200% 0, 0 0; }}@-moz-keyframes colorFlow {	0% { background-position:0 0, 0% 50%; }	50% { background-position:0 0, 101% 50%; }	/*101% hides the seam*/	/*100% { background-position:0 0, 0% 50%; }}*//*Source - https://stackoverflow.com/a/38173276Posted by RP The Designer, modified by community. See post 'Timeline' for change historyRetrieved 2026-02-13, License - CC BY-SA 3.0*/#gradient{    height:300px;    width:300px;    border:1px solid black;    font-size:30px;    background: linear-gradient(130deg, #ff7e00, #ffffff, #5cff00);    background-size: 200% 200%;    -webkit-animation: Animation 5s ease infinite;    -moz-animation: Animation 5s ease infinite;    animation: Animation 5s ease infinite;}@-webkit-keyframes Animation {    0%{background-position:10% 0%}    50%{background-position:91% 100%}    100%{background-position:10% 0%}}@-moz-keyframes Animation {    0%{background-position:10% 0%}    50%{background-position:91% 100%}    100%{background-position:10% 0%}}@keyframes Animation {     0%{background-position:10% 0%}    50%{background-position:91% 100%}    100%{background-position:10% 0%}}/*  4. RESPONSIVE BREAKPOINTS  ======= ==================================== *//* Tablet/Desktop: Cap the width for readability */@media screen and (min-width: 1000px) {	html { font-size: 24px; }	body {	  max-width: 75ch;	  margin-inline: auto;/* Centers the layout */	}}/* Mobile: Ensure font is legible */@media screen and (max-width: 520px) {	/*html { font-size: 16px; }*/	html { font-size: 14px; }}/* ----------------------------------------------------   2. SWIRLING BACKGROUND-----------------------------------------------------*/.swirl-bg {  position: relative;  min-height: 100vh;  background: #0d0d0d;  overflow: hidden;  display: flex;  align-items: center;  justify-content: center;}.swirl-bg::before {  content: "";  position: absolute;  inset: 0;  background:    radial-gradient(circle at 30% 30%, var(--swirl-gray-1) 0%, transparent 60%),    radial-gradient(circle at 70% 70%, var(--swirl-gray-2) 0%, transparent 70%);  background-size: 200% 200%;  mix-blend-mode: screen;  opacity: var(--swirl-opacity-min);  animation:    swirlMove var(--swirl-move-duration) ease-in-out infinite,    swirlPulse var(--swirl-pulse-duration) ease-in-out infinite;  transform-origin: center;  pointer-events: none;}@keyframes swirlMove {0%{ background-position:0% 0%;	transform: rotate(0deg); }50%{ background-position:100% 100%;	transform: rotate(8deg); }100%{ background-position:0% 0%;	transform: rotate(0deg); }}@keyframes swirlPulse {  0%, 100% { opacity: var(--swirl-opacity-min); }  50%      { opacity: var(--swirl-opacity-max); }}/* ----------------------------------------------------   3. BLEND-MODE OVERLAYS---------------------------------------------------- */.overlay {  pointer-events: none;  position: absolute;  inset: 0;}.overlay-vignette {  background: radial-gradient(    circle at center,    transparent 40%,    var(--overlay-vignette-color) 100%  );  mix-blend-mode: multiply;  opacity: var(--overlay-vignette-opacity);}.overlay-light {  background: radial-gradient(    circle at 50% 30%,    var(--overlay-light-color) 0%,    transparent 70%  );  mix-blend-mode: screen;  opacity: var(--overlay-light-opacity);  animation: lightDrift 20s ease-in-out infinite;}@keyframes lightDrift {  0%   { background-position: 50% 30%; }  50%  { background-position: 60% 40%; }  100% { background-position: 50% 30%; }}.overlay-noise {  background-image: var(--overlay-noise-img);  background-size: cover;  mix-blend-mode: overlay;  opacity: var(--overlay-noise-opacity);}/* ----------------------------------------------------   4. GLASS PANEL + MOVING SHEEN---------------------------------------------------- */.glass-panel {  position: relative;  padding: 2rem 3rem;  border-radius: var(--glass-radius);  background: var(--glass-bg);  backdrop-filter: blur(var(--glass-blur)) saturate(140%);  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(140%);  border: 1px solid var(--glass-border);  box-shadow:    inset 0 0 25px var(--glass-inner-glow),    0 8px 25px rgba(0, 0, 0, 0.4);  overflow: hidden;  color: white;  text-align: center;  max-width: 480px;}.glass-panel::after {  content: "";  position: absolute;  top: 0;  left: -150%;  width: 120%;  height: 100%;  background: linear-gradient(    115deg,    transparent 0%,    var(--sheen-light-1) 45%,    var(--sheen-light-2) 50%,    var(--sheen-light-1) 55%,    transparent 100%  );  opacity: var(--sheen-opacity);  transform: skewX(-15deg);  animation: sheenMove var(--sheen-duration) ease-in-out infinite;}@keyframes sheenMove {  0%   { left: -150%; }  50%  { left: 150%; }  100% { left: -150%; }}</style></head><body><div class="swirl-bg">  <!-- Blend-mode overlays -->  <div class="overlay overlay-vignette"></div>  <div class="overlay overlay-light"></div>  <div class="overlay overlay-noise"></div>  <!-- Glass panel -->  <div class="glass-panel">    <h1>Liquid Glass Preview</h1>    <p>Swirling gradient, blend modes, and moving sheen.</p>  </div></div></body></html>
