<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Blend Mode Slider + Liquid Glass</title><style>/* ------------------------------   BACKGROUND: Multi‑Layer Swirl--------------------------------*/  :root {  --bg1:#222020;  --bg2:#454343;  --shape1:#ff6b6b;  --shape2:#4d7cff;	--sh-quote:var(--sh-qt);	--sh-qt:0 4px 16px #0000001A, inset 0 2px 8px #FFF2, inset 0 0 18px #FFF4;	--qt-bg:rgba(255,255,255,.01);  --bg-qt:rgba(255,255,255,.01);	--blu3:#068D9D;	--cyr:color-mix(in srgb,#0F0 48%,#00F 50%);	--cyn:color-mix(in oklab,#0F0 47%,#00F 53%);	--cy3:color-mix(in oklab,#0F0 45%,#00F 55%);	--cy2:color-mix(in oklab,#0F0 50%,#00F 50%);	--c9n:color-mix(in oklab,#0F0 49%,#00F 51%);	--c7n:color-mix(in srgb,var(--cyn) 70%,transparent 30%);	--c8n:color-mix(in srgb, #3695B0 70%,transparent 30%);	--csn:color-mix(in srgb,var(--cyn) 10%,transparent 90%);  --sh-btn-on2:inset 0 1px 3px rgba(0,0,0,0.15), 0 4px 16px #0002, inset 0 2px 8px rgba(0,0,0,0.15), inset 0 0 18px rgba(0,0,0,0.5),inset 0 0 22px var(--csn);  --sh-frost:inset 0 0 1px .05px rgba(255,255,255,.8), 0 0 6px #0001, inset 0 0 6px #FFF2, inset 0 2px 10px #FFF4, inset 0 0 18px #FFF6;  --bg-btn-on2:rgba(255,255,255,.2);  --bg-btn-off2:rgba(255,255,255,.1);  --bg-btn-on:#161618;  --bg-btn-off:#202027;  --bg-btn:var(--bg-btn-off);  --txt-btn-on:#00D9FFCC;  --txt-btn-off:#AAAA;  --txt-btn:var(--txt-btn-off);	--sh-btn-txt:0 0 0 #FFF,0 -1.2px 3.15px #3457D566,0 1.2px 3.15px #3457D544,0 0 3.2px #00FC,0 0 3.2px #0DF,0 0 3.2px #FFF8;	--sh-txt-btn-off:var(--sh-btn-txt);	--sh-btn:0 0 3px hsla(223, 20%, 5%, .23),-1.2px .6px 4px hsla(223, 20%, 5%, .23),0 -1px 4px hsla(223, 20%, 5%, .20),inset 0 0 16px hsla(223, 20%, 26%, .1),0 1px 10px hsla(223, 20%, 1%, .28);	--sh-btn-off:var(--sh-btn);  --sh-btn-on:inset 2px 1.5px 7px hsla(223, 10%, 45%, .28),inset -2px -1.5px 12px hsla(223, 10%, 1%, .21),inset 3px 2px 12px hsla(223, 10%, 1%, .21),inset -3px -2px 12px hsla(223, 10%, 1%, .21),inset -2px 2px 14px hsla(223, 10%, 0%, .11),inset 2px 2px 14px hsla(223, 10%, 0%, .11);  --sh-btn-hover:var(--sh-btn-on);	--sh-btn-txt-hover:0 0 0 var(--cyn),0 -.62px 2.5px #3457D566,0 .62px 2.15px #3457D544,0 0 2.8px #00F4,0 0 .3em #06FC,0 0 3px #FFF6,0 0 3.2px var(--cyn),0 0 3px #00FC;	--code:#0EFFEE;	--sh-code:0 0 2px #0EFFEE44, 0 0 3.4px #01202C,						 0 0 2px #00335880,						0 0 3px var(--c7n),								0 0 3.4px #0002;   --prag:"PragmataProMonoLiga-Regular", "PragmataPro-Regular","PragmataProMonoW20-Regular";}body {  margin: 0;  font-family: system-ui, sans-serif;  height: 100vh;  display: flex;  align-items: center;  justify-content: center;  background: #0f1117;  padding:.1rem 2rem;}.bg {  position: fixed;  inset: 0;  z-index: -3;  background: radial-gradient(circle at 30% 30%, #2a2f45, transparent 60%),              radial-gradient(circle at 70% 70%, #1a1d2b, transparent 60%);  animation: swirl1 18s infinite linear;  opacity: 0.7;}.bg2 {  position: fixed;  inset: 0;  z-index: -2;  background: radial-gradient(circle at 70% 30%, #3a3f5a, transparent 60%),              radial-gradient(circle at 30% 70%, #24283b, transparent 60%);  animation: swirl2 28s infinite linear reverse;  opacity: 0.5;}@keyframes swirl1 {  0% { transform: rotate(0deg) scale(1); }  100% { transform: rotate(360deg) scale(1.1); }}@keyframes swirl2 {  0% { transform: rotate(0deg) scale(1.1); }  100% { transform: rotate(-360deg) scale(1); }}/* ------------------------------   LIQUID GLASS PANEL--------------------------------*/.panel {  width: 90%;  max-width: 420px;  padding: 1.5rem;  border-radius: 24px;  background: rgba(255,255,255,0.05);  backdrop-filter: blur(18px) saturate(160%);  -webkit-backdrop-filter: blur(18px) saturate(160%);  box-shadow:var(--sh-frost);  position: relative;  overflow: hidden;}/* Sheen */.panel::before {  content: "";  position: absolute;  inset: 0;  background: linear-gradient(120deg,    transparent 0%,    rgba(255,255,255,0.05) 50%,    transparent 100%);  transform: translateX(-100%);  animation: sheen 6s infinite;}@keyframes sheen {  0% { transform: translateX(-100%); }  60% { transform: translateX(120%); }  100% { transform: translateX(120%); }}/* ------------------------------   SLIDER STAGE--------------------------------*/.stage {  position: relative;  width: 100%;  height: 260px;  margin-bottom: 1rem;  border-radius: 16px;  overflow: hidden;}.shape {  position: absolute;  width: 180px;  height: 180px;  border-radius: 32px;}.a {  background: #ff6b6b;  top: 20px;  left: 20px;}.b {  background: #4d7cff;  bottom: 20px;  right: 20px;}/* Before/After mask */.after {  position: absolute;  inset: 0;  overflow: hidden;}.after .b {  mix-blend-mode: multiply; /* default */}.handle {  position: absolute;  top: 0;  bottom: 0;  width: 4px;  background: white;  border-radius: 2px;  cursor: ew-resize;}/* ------------------------------   MODE BUTTONS--------------------------------*/.modes {  display: flex;  flex-wrap: wrap;  gap: 0.4rem;  justify-content: center;}button {  padding: 0.4rem 0.7rem;  border: none;  border-radius: 8px;  background: rgba(255,255,255,0.15);  color: white;  font-size: 0.85rem;  backdrop-filter: blur(6px);  -webkit-backdrop-filter: blur(6px);  cursor: pointer;    font-family:var(--prag);    padding: 0.5rem 0.75rem;    border: none;    border-radius: 8px;    font-size: 0.9rem;    background: var(--bg-btn-off);    box-shadow:var(--sh-btn-off);    cursor: pointer;    color:rgba(255,255,255,.81);	border:none;	border-left:none;	border-bottom:none;	border-top:none;	border-right:none;	border-color:none;  border-radius:8px;  background:var(--bg-btn-off);	box-shadow:var(--sh-btn);	color:#AAAA;	cursor:pointer;	font-family:NovaMono,Monoflow;  font-size:1rem;	margin:.15em .25em;	min-width:8ch;	outline:none;  text-shadow:var(--sh-btn-txt);  cursor:pointer;  padding:0.5rem 0.75rem;}button.hover, button.focus, button.active {	color:#00D9FFCC;	text-shadow:var(--sh-btn-txt-hover);	background:#161618;  background:radial-gradient(circle, #00BBFF22, #00AAFF44);  background: var(--bg-btn-on);	box-shadow:var(--sh-btn-on);  border:none;	border-color:none;	cursor:pointer;	outline:none;}</style></head><body><div class="bg"></div><div class="bg2"></div><div class="panel">  <div class="stage" id="stage">    <div class="before">      <div class="shape a"></div>      <div class="shape b"></div>    </div>    <div class="after" id="after">      <div class="shape a"></div>      <div class="shape b" id="blend"></div>    </div>    <div class="handle" id="handle"></div>  </div>  <div class="modes" id="buttons"></div></div><script>/* ------------------------------   BLEND MODE BUTTONS--------------------------------*/const modes = [  "normal","multiply","screen","overlay","darken","lighten",  "color-dodge","color-burn","difference","exclusion",  "hard-light","soft-light","hue","saturation","color",  "luminosity","plus-lighter"];const container = document.getElementById("buttons");const blend = document.getElementById("blend");modes.forEach(mode => {  const btn = document.createElement("button");  btn.textContent = mode;  btn.addEventListener("click", () => {    blend.style.mixBlendMode = mode;    document.querySelectorAll("button").forEach(b => b.classList.remove("active"));    btn.classList.add("active");  });  container.appendChild(btn);});/* ------------------------------   BEFORE/AFTER SLIDER--------------------------------*/const stage = document.getElementById("stage");const after = document.getElementById("after");const handle = document.getElementById("handle");let dragging = false;const update = (x) => {  const rect = stage.getBoundingClientRect();  const pos = Math.min(Math.max(x - rect.left, 0), rect.width);  after.style.clipPath = `inset(0 ${rect.width - pos}px 0 0)`;  handle.style.left = pos + "px";};handle.addEventListener("pointerdown", () => dragging = true);window.addEventListener("pointerup", () => dragging = false);window.addEventListener("pointermove", (e) => dragging && update(e.clientX));update(stage.getBoundingClientRect().width * 0.5);</script></body></html>
