<!DOCTYPE html><html lang="en"><head>	<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">	<title>Animated Definition List with Copy</title><link rel="stylesheet" type="text/css" media="all" href="../assets/mdmdmdmd.css"/><style>body {line-height:1.6;padding:2em;font-size:16px;}dl {	max-width: 700px;	margin: 0 auto;}dl dt/*.accordion .item*/ {	border-bottom: 1px solid #444;	padding: 0.5em 0;}dt {	cursor: pointer;	font-weight: bold;	margin: 0;	outline: none;}dt:focus {	outline: 2px solid #888;}dd {	max-height: 0;	overflow: hidden;	transition: max-height 0.4s ease, opacity 0.4s ease;	opacity: 0;	margin: 0;	padding-left: 1em;}/*.accordion .item.open*/ dd {	max-height: 200px;	opacity: 1;	margin-top: 0.5em;}dd {	display: flex;	align-items: flex-start;	gap: 0.5em;}dd {	flex: 1;}.copy-btn {	background: #333;	color: #ccc;	border: none;	padding: 0.25em 0.5em;	cursor: pointer;	font-size: 1em;	border-radius: 4px;	transition: background 0.3s;	color:#00D9E0CC;	margin-left:1.4em !important;	margin-top:1em !important;	background:#202027 !important;	border:1px solid #0000 !important;	border-color:#0000 !important;	border-radius:.5em !important;	box-shadow:0 0 3px hsla(223, 20%, 5%, .23),-1.2px .6px 4px hsla(223, 20%, 5%, .23),0 -1px 4px hsla(223, 20%, 5%, .20),inset 0 0 16px hsla(223, 20%, 26%, .1),0 1px 10px hsla(223, 20%, 1%, .28) !important;	color:#00D9FFCC !important;	cursor:pointer;	font-family:'Monoflow', 'Monotalic-NarrowLight', 'Monotalic-Narrow', monospace !important;	font-size:.8em !important;	line-height:.81 !important;	padding:.43em .26em .43em .26em !important;	text-shadow:0 0 0 #FFF,0 -1.2px 3.15px #3457D566,0 1.2px 3.15px #3457D544,0 0 3.2px #00FC,0 0 3.2px #0DF,0 0 3.2px #FFF8 !important;	margin-right:.85em !important;	min-width:9ch !important;}.copy-btn:hover {	background-color:#161618 !important;	color:#BBB8 !important;	box-shadow:inset 2px 1.5px 7px hsla(223, 10%, 45%, .28),inset -2px -1.5px 12px hsla(223, 10%, 1%, .21),inset 3px 2px 12px hsla(223, 10%, 1%, .21),inset -3px -2px 12px hsla(223, 10%, 1%, .21),inset -2px 2px 14px hsla(223, 10%, 0%, .11),inset 2px 2px 14px hsla(223, 10%, 0%, .11) !important;	border:1px solid #0000 !important;	outline:none !important;	border-left:1px solid #0000 !important;	border-bottom:1px solid #0000 !important;	border-left:1px solid #0000 !important;	border-top:1px solid #0000 !important;	border-right:1px solid #0000 !important;	border-color:#0000 !important;	text-shadow:0 0 0 #FFFC,0 0 3.2px #00FC,0 0 .3em #FFFC,0 0 4.2px #FFF8,0 0 0 #FFF !important;	font-family:var(--mnflw) !important;	font-size:.79em !important;	margin-right:.86em !important;}</style></head><body>	<h1>Animated Definition List with Copy</h1>	<dl class="accordion">	<div class="item">		<dt tabindex="0">HTML</dt>		<dd>		<div class="dd-wrapper">			<span class="dd-text">HTML is the standard markup language for web pages.</span>			<button class="copy-btn" aria-label="Copy definition">copy</button>		</div>		</dd>	</div>	<div class="item">		<dt tabindex="0">CSS</dt>		<dd>		<div class="dd-wrapper">			<span class="dd-text">CSS describes how HTML elements are displayed on screen or other media.</span>			<button class="copy-btn" aria-label="Copy definition">copy</button>		</div>		</dd>	</div>	</dl>	<script>	// Auto-close accordion behavior	document.querySelectorAll('.accordion dt').forEach(dt => {		dt.addEventListener('click', () => {		const currentItem = dt.parentElement;		document.querySelectorAll('.accordion .item').forEach(item => {			if (item !== currentItem) item.classList.remove('open');		});		currentItem.classList.toggle('open');		});		dt.addEventListener('keypress', e => {		if (e.key === 'Enter' || e.key === ' ') {			e.preventDefault();			dt.click();		}		});	});	// Copy-to-clipboard functionality	document.querySelectorAll('.copy-btn').forEach(button => {		button.addEventListener('click', () => {		const text = button.previousElementSibling.textContent;		navigator.clipboard.writeText(text).then(() => {			button.textContent = 'copied!';			setTimeout(() => button.textContent = 'copy', 1500);		});		});	});	</script></body></html>
