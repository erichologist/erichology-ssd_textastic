<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Mask vs ClipPath — Tap Compare</title><style>/* ------------------------------   Multi‑Layer Liquid‑Glass BG--------------------------------*/body {  margin: 0;  font-family: system-ui, sans-serif;  height: 100vh;  display: flex;  flex-direction: column;  align-items: center;  justify-content: center;  gap: 1.25rem;  background:    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25), transparent 60%),    radial-gradient(circle at 80% 70%, rgba(255,255,255,0.18), transparent 60%),    linear-gradient(135deg, #dfe7f5, #c7d4e8);  backdrop-filter: blur(20px);}/* ------------------------------   Liquid‑Glass Panel--------------------------------*/.panel {  width: 300px;  height: 300px;  position: relative;  border-radius: 24px;  overflow: hidden;  background: rgba(255,255,255,0.25);  backdrop-filter: blur(18px) saturate(180%);  box-shadow: 0 8px 24px rgba(0,0,0,0.15);}/* ------------------------------   Buttons--------------------------------*/.controls {  display: flex;  gap: 0.75rem;}button {  padding: 0.6rem 1rem;  border: none;  border-radius: 10px;  background: rgba(255,255,255,0.7);  backdrop-filter: blur(10px);  font-size: 0.9rem;  box-shadow: 0 2px 6px rgba(0,0,0,0.15);  cursor: pointer;}button.active {  background: #4d7cff;  color: white;}/* ------------------------------   Demo Shapes--------------------------------*/.demo {  width: 100%;  height: 100%;}.rect {  width: 100%;  height: 100%;  fill: url(#grad);}</style></head><body><div class="panel">  <svg class="demo" viewBox="0 0 300 300">    <defs>      <!-- Gradient fill -->      <linearGradient id="grad" x1="0" x2="1" y1="0" y2="1">        <stop offset="0%" stop-color="#ff6b6b"/>        <stop offset="100%" stop-color="#4d7cff"/>      </linearGradient>      <!-- Soft fade mask -->      <mask id="fadeMask">        <rect width="300" height="300" fill="white"/>        <rect width="300" height="300" fill="black" x="150"/>      </mask>      <!-- Hard circle clip -->      <clipPath id="circleClip">        <circle cx="150" cy="150" r="110"/>      </clipPath>    </defs>    <rect id="target" class="rect" />  </svg></div><div class="controls">  <button id="btnMask">Mask</button>  <button id="btnClip">ClipPath</button></div><script>const target = document.getElementById("target");const btnMask = document.getElementById("btnMask");const btnClip = document.getElementById("btnClip");function activate(btn) {  document.querySelectorAll("button").forEach(b => b.classList.remove("active"));  btn.classList.add("active");}btnMask.onclick = () => {  target.removeAttribute("clip-path");  target.setAttribute("mask", "url(#fadeMask)");  activate(btnMask);};btnClip.onclick = () => {  target.removeAttribute("mask");  target.setAttribute("clip-path", "url(#circleClip)");  activate(btnClip);};// Default statebtnMask.click();</script></body></html>
