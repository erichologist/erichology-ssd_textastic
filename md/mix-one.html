<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>mix-blend-mode — Minimal Demo</title><style>  :root {    --bg1: #f0f4ff;    --bg2: #dbe9ff;    --bg1: #222020;    --bg2: #454343;    --shape1: #222;    --shape2: #111;	--sh-quote:var(--sh-qt);	--sh-qt:0 4px 16px #0000001A, inset 0 2px 8px #FFF2, inset 0 0 18px #FFF4;	--qt-bg:rgba(255,255,255,.01);  --bg-qt:rgba(255,255,255,.01);  }  body {    margin: 0;    font-family: system-ui, sans-serif;    background: linear-gradient(135deg, var(--bg1), var(--bg2));    height: 100vh;    display: flex;    flex-direction: column;    align-items: center;    justify-content: center;    gap: 1.5rem;  }  .stage {    position: relative;    width: 260px;    height: 260px;  }  .shape {    position: absolute;    width: 160px;    height: 160px;    border-radius: 32px;    transition: mix-blend-mode 0.2s ease;  }  .shape.a {    background: var(--shape1);    top: 0;    left: 0;  }  .shape.b {    background: var(--shape2);    bottom: 0;    right: 0;  }  select {    padding: 0.5rem 0.75rem;    font-size: 1rem;    border-radius: 8px;    border:.05px solid #222;    color:#fff;    font-family:"PragmataProMonoLiga-Regular", "PragmataPro-Regular","PragmataProMonoW20-Regular";    background: rgba(255,255,255,.21);    box-shadow: 0 0 0 .15px rgba(255,255,255,.5),0 4px 6px #0008, 0 0 2px #FFF8, 0 0 8px #0008;    outline:none;  }select>option,option{      font-family:"PragmataProMonoLiga-Regular", "PragmataPro-Regular","PragmataProMonoW20-Regular";}</style></head><body><div class="stage">  <div class="shape a"></div>  <div class="shape b" id="blend"></div></div><select id="mode">  <option value="normal">normal</option>  <option value="multiply">multiply</option>  <option value="screen">screen</option>  <option value="overlay">overlay</option>  <option value="darken">darken</option>  <option value="lighten">lighten</option>  <option value="color-dodge">color-dodge</option>  <option value="color-burn">color-burn</option>  <option value="difference">difference</option>  <option value="exclusion">exclusion</option>  <option value="hard-light">hard-light</option>  <option value="soft-light">soft-light</option>  <option value="hue">hue</option>  <option value="saturation">saturation</option>  <option value="color">color</option>  <option value="luminosity">luminosity</option>  <option value="plus-lighter">plus-lighter</option></select><script>  const blend = document.getElementById("blend");  const mode = document.getElementById("mode");  mode.addEventListener("change", () => {    blend.style.mixBlendMode = mode.value;  });</script></body></html>
