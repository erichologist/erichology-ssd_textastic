<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Blend Mode Click Demo</title><style>  :root {  --bg1:#222020;  --bg2:#454343;  --shape1:#ff6b6b;  --shape2:#4d7cff;	--sh-quote:var(--sh-qt);	--sh-qt:0 4px 16px #0000001A, inset 0 2px 8px #FFF2, inset 0 0 18px #FFF4;	--qt-bg:rgba(255,255,255,.01);  --bg-qt:rgba(255,255,255,.01);	--blu3:#068D9D;	--cyr:color-mix(in srgb,#0F0 48%,#00F 50%);	--cyn:color-mix(in oklab,#0F0 47%,#00F 53%);	--cy3:color-mix(in oklab,#0F0 45%,#00F 55%);	--cy2:color-mix(in oklab,#0F0 50%,#00F 50%);	--c9n:color-mix(in oklab,#0F0 49%,#00F 51%);	--c7n:color-mix(in srgb,var(--cyn) 70%,transparent 30%);	--c8n:color-mix(in srgb, #3695B0 70%,transparent 30%);	--csn:color-mix(in srgb,var(--cyn) 10%,transparent 90%);  --sh-btn-on2:inset 0 1px 3px rgba(0,0,0,0.15), 0 4px 16px #0002, inset 0 2px 8px rgba(0,0,0,0.15), inset 0 0 18px rgba(0,0,0,0.5),inset 0 0 22px var(--csn);  --sh-btn-off2:0 1px 8px rgba(0,0,0,0.1), 0 0 6px #0001, inset 0 2px 8px #FFF2, inset 0 0 18px #FFF4;  --bg-btn-on2:rgba(255,255,255,.2);  --bg-btn-off2:rgba(255,255,255,.1);  --bg-btn-on:#161618;  --bg-btn-off:#202027;  --bg-btn:var(--bg-btn-off);  --txt-btn-on:#00D9FFCC;  --txt-btn-off:#AAAA;  --txt-btn:var(--txt-btn-off);	--sh-btn-txt:0 0 0 #FFF,0 -1.2px 3.15px #3457D566,0 1.2px 3.15px #3457D544,0 0 3.2px #00FC,0 0 3.2px #0DF,0 0 3.2px #FFF8;	--sh-txt-btn-off:var(--sh-btn-txt);	--sh-btn:0 0 3px hsla(223, 20%, 5%, .23),-1.2px .6px 4px hsla(223, 20%, 5%, .23),0 -1px 4px hsla(223, 20%, 5%, .20),inset 0 0 16px hsla(223, 20%, 26%, .1),0 1px 10px hsla(223, 20%, 1%, .28);	--sh-btn-off:var(--sh-btn);  --sh-btn-on:inset 2px 1.5px 7px hsla(223, 10%, 45%, .28),inset -2px -1.5px 12px hsla(223, 10%, 1%, .21),inset 3px 2px 12px hsla(223, 10%, 1%, .21),inset -3px -2px 12px hsla(223, 10%, 1%, .21),inset -2px 2px 14px hsla(223, 10%, 0%, .11),inset 2px 2px 14px hsla(223, 10%, 0%, .11);  --sh-btn-hover:var(--sh-btn-on);	--sh-btn-txt-hover:0 0 0 var(--cyn),0 -.62px 2.5px #3457D566,0 .62px 2.15px #3457D544,0 0 2.8px #00F4,0 0 .3em #06FC,0 0 3px #FFF6,0 0 3.2px var(--cyn),0 0 3px #00FC;	--code:#0EFFEE;	--sh-code:0 0 2px #0EFFEE44, 0 0 3.4px #01202C,						 0 0 2px #00335880,						0 0 3px var(--c7n),								0 0 3.4px #0002;   --prag:"PragmataProMonoLiga-Regular", "PragmataPro-Regular","PragmataProMonoW20-Regular";    --shape1: #746E6C;    --shape2: #535252;}  body {    margin:0;    font-family:system-ui, sans-serif;    background:linear-gradient(135deg, var(--bg1), var(--bg2));    padding:1.5rem;    display:flex;    flex-direction:column;    align-items:center;    gap:1.5rem;    min-height:100vh;  }  .stage {    position:relative;    width:260px;    height:260px;  }  .shape {    position:absolute;    width:160px;    height:160px;    border-radius:32px;    transition:mix-blend-mode 0.15s ease;  }  .shape.a {    background:var(--shape1);    top:0;    left:0;  }  .shape.b {    background:var(--shape2);    bottom:0;    right:0;  }  .modes {    display:flex;    flex-wrap:wrap;    justify-content:center;    gap:0.5rem;    max-width:360px;  }button {	border:none;	border-left:none;	border-bottom:none;	border-top:none;	border-right:none;	border-color:none;  border-radius:8px;  background:var(--bg-btn-off);	box-shadow:var(--sh-btn);	color:#AAAA;	cursor:pointer;	font-family:NovaMono,Monoflow;  font-size:1rem;	margin:.15em .25em;	min-width:8ch;	outline:none;  text-shadow:var(--sh-btn-txt);  cursor:pointer;  padding:0.5rem 0.75rem;}button.hover, button.focus, button.active {	background-color:#161618;  border:none;	border-color:none;	box-shadow:var(--sh-btn-on);	cursor:pointer;	color:#00D9FFCC;	outline:none;	text-shadow:var(--sh-btn-txt-hover);}</style></head><body><div class="stage">  <div class="shape a"></div>  <div class="shape b" id="blend"></div></div><div class="modes" id="buttons"></div><script>  const modes = [    "normal","multiply","screen","overlay","darken","lighten",    "color-dodge","color-burn","difference","exclusion",    "hard-light","soft-light","hue","saturation","color",    "luminosity","plus-lighter"  ];  const container = document.getElementById("buttons");  const blend = document.getElementById("blend");  modes.forEach(mode => {    const btn = document.createElement("button");    btn.textContent = mode;    btn.addEventListener("click", () => {      blend.style.mixBlendMode = mode;      document.querySelectorAll("button").forEach(b => b.classList.remove("active"));      btn.classList.add("active");    });    container.appendChild(btn);  });</script></body></html>
