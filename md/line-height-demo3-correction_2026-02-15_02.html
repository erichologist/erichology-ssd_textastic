<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Font Lab: 4 Panels + Grid + Metrics + Tokens</title><style>:root {  --font-body: "Monotalic-NarrowLight", "Monotalic-Narrow", monospace;  --lh-body: 1.55;  --lh-heading: 1.22;  --lh-code: 1.48;  --base-font-size: 16px;  --bg: #111;  --fg: #eee;  --panel-bg: #181818;  --panel-border: #333;  --accent: #4da3ff;}*,*::before,*::after {  box-sizing: border-box;}html, body {  max-width: 100%;}html, body {  width: 100%;  max-width: 100%;}body {  margin: 0;  padding: 1rem;  background: var(--bg);  color: var(--fg);  font-family: var(--font-body);  line-height: var(--lh-body);  font-size: var(--base-font-size);  transition: background 0.2s ease;}body.baseline-on {  background-image: linear-gradient(    to bottom,    rgba(255,255,255,0.08) 1px,    transparent 1px  );  background-size: 100% 4px;}h1, h2, h3 {  line-height: var(--lh-heading);}/* Top controls */.top-controls {  display: flex;  flex-direction: column;  gap: 0.75rem;  margin-bottom: 1rem;  padding: 0.75rem;  border-radius: 10px;  background: #181818;  border: 1px solid #333;}.top-controls-row {  display: flex;  flex-wrap: wrap;  gap: 1rem;  align-items: center;}.top-controls label {  font-size: 0.9rem;}input[type="range"] {  width: 180px;}/* Grid layout */.grid {  display: grid;  gap: 1rem;}@media (min-width: 900px) {  .grid {    grid-template-columns: repeat(2, 1fr);  }}@media (min-width: 1400px) {  .grid {    grid-template-columns: repeat(4, 1fr);  }}.panel {  background: var(--panel-bg);  border: 1px solid var(--panel-border);  border-radius: 12px;  padding: 1rem;  display: flex;  flex-direction: column;  gap: 0.75rem;  position: relative;}/* Panel controls */.panel-header {  display: flex;  justify-content: space-between;  align-items: center;  gap: 0.5rem;}.panel-header h2 {  margin: 0;  font-size: 1rem;}select,input[type="file"] {  width: 100%;  padding: 0.5rem;  border-radius: 8px;  background: #222;  color: #eee;  border: 1px solid #444;  font-size: 0.85rem;}.panel-controls {  display: grid;  grid-template-columns: 1.2fr 1fr;  gap: 0.5rem;  align-items: center;}.panel-controls small {  font-size: 0.75rem;  opacity: 0.8;}/* Markdown preview */.preview {  position: relative;  padding: 0.5rem 0;}.preview h1 { font-size: 1.6rem; margin: 1rem 0 0.5rem; }.preview h2 { font-size: 1.3rem; margin: 1rem 0 0.5rem; }.preview h3 { font-size: 1.1rem; margin: 1rem 0 0.5rem; }.preview p { margin: 0.5rem 0; }.preview blockquote {  border-left: 4px solid #555;  padding-left: 1rem;  margin: 0.8rem 0;  opacity: 0.9;}.preview ul,.preview ol {  margin: 0.5rem 0 0.5rem 1.2rem;}.preview code {  background: rgba(255,255,255,0.08);  padding: 0.2rem 0.4rem;  border-radius: 4px;}.preview pre {  background: rgba(255,255,255,0.05);  padding: 1rem;  border-radius: 8px;  overflow-x: auto;  line-height: var(--lh-code);}/* Metrics overlay */.panel.metrics-on .preview::before {  content: "";  position: absolute;  inset: 0;  pointer-events: none;  background-image:    repeating-linear-gradient(      to bottom,      rgba(255, 0, 0, 0.25) 0,      rgba(255, 0, 0, 0.25) 10%,      transparent 10%,      transparent 30%,      rgba(0, 255, 0, 0.25) 30%,      rgba(0, 255, 0, 0.25) 60%,      transparent 60%,      transparent 70%,      rgba(0, 150, 255, 0.25) 70%,      rgba(0, 150, 255, 0.25) 72%,      transparent 72%,      transparent 85%,      rgba(255, 255, 0, 0.25) 85%,      rgba(255, 255, 0, 0.25) 100%    );  background-size: 100% 1.4em;}/* Textarea */textarea {  width: 100%;  height: 140px;  background: #000;  color: #eee;  border: 1px solid #444;  border-radius: 8px;  padding: 0.7rem;  font-family: var(--font-body);  line-height: var(--lh-body);  font-size: 0.9rem;}/* Token inspector + editor */.tokens {  background: #000;  border: 1px solid #333;  border-radius: 8px;  padding: 0.6rem;  font-size: 0.8rem;  line-height: 1.4;  color: #9cf;  white-space: pre-wrap;}.token-editor {  display: grid;  grid-template-columns: repeat(3, 1fr);  gap: 0.4rem;  margin-top: 0.3rem;}.token-editor label {  font-size: 0.75rem;  display: flex;  flex-direction: column;  gap: 0.15rem;}.token-editor input {  padding: 0.25rem 0.35rem;  border-radius: 6px;  border: 1px solid #444;  background: #111;  color: #eee;  font-size: 0.75rem;}.legend {  background: #181818;  border: 1px solid #333;  padding: 0.75rem 1rem;  border-radius: 10px;  margin-bottom: 1rem;}.legend h3 {  margin: 0 0 0.5rem;  font-size: 1rem;  color: #9cf;}.legend-row {  display: flex;  align-items: center;  gap: 0.5rem;  font-size: 0.85rem;  margin: 0.25rem 0;}.swatch {  width: 22px;  height: 12px;  border-radius: 3px;  display: inline-block;}.swatch.asc  { background: rgba(255, 0, 0, 0.35); }.swatch.xh   { background: rgba(0, 255, 0, 0.35); }.swatch.base { background: rgba(0, 150, 255, 0.35); }.swatch.desc { background: rgba(255, 255, 0, 0.35); }/*input, select, textarea {  font-size: 16px;}input, select, textarea {  font-size: 16px;  transform: scale(0.85);  transform-origin: left top;}input, select, textarea {  font-size: 16px !important;}input, select, textarea {  font-size: 16px !important;  transform: scale(0.85);  transform-origin: top left;}*/input, select, textarea {  font-size: 16px !important;}input, select, textarea {  font-size: 16px !important;  transform: scale(0.85) !important;  transform-origin: top left !important;}@media (min-width: 700px) {  .grid {    grid-template-columns: repeat(2, 1fr);  }}@media (min-width: 1200px) {  .grid {    grid-template-columns: repeat(4, 1fr);  }}</style></head><body><!--<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"><meta name="viewport" content="width=device-width, initial-scale=1.0">--><div class="top-controls">  <div class="top-controls-row">    <label>      Font size scale:      <input id="fontSizeSlider" type="range" min="14" max="22" value="16" />      <span id="fontSizeValue">16px</span>    </label>  </div>  <div class="top-controls-row">    <label>      <input id="baselineToggle" type="checkbox" />      Baseline grid overlay (global)    </label>  </div></div><div class="grid">  <!-- PANEL A -->  <div class="panel" data-panel-root="a">    <div class="panel-header">      <h2>Panel A</h2>      <label style="font-size:0.75rem;">        <input type="checkbox" class="metricsToggle" data-panel="a" />        Metrics overlay      </label>    </div>    <div class="panel-controls">      <select class="fontSelect" data-panel="a">        <option value="monotalic">Monotalic Narrow</option>        <option value="monoflow">Monoflow</option>        <option value="pragmata">PragmataPro</option>        <option value="cartograph">Cartograph CF</option>        <option value="dankmono">Dank Mono Italic</option>      </select>      <div>        <input type="file" class="fileLoader" data-panel="a" accept=".md" />        <small>Load .md file</small>      </div>    </div>    <textarea class="mdInput" data-panel="a"># Panel AType or load Markdown here.</textarea>    <div class="preview" id="preview-a"></div>    <div class="tokens" id="tokens-a"></div>    <div class="token-editor">      <label>lh-body        <input type="text" data-panel="a" data-token="--lh-body" placeholder="1.55" />      </label>      <label>lh-heading        <input type="text" data-panel="a" data-token="--lh-heading" placeholder="1.22" />      </label>      <label>lh-code        <input type="text" data-panel="a" data-token="--lh-code" placeholder="1.48" />      </label>    </div>  </div>  <!-- PANEL B -->  <div class="panel" data-panel-root="b">    <div class="panel-header">      <h2>Panel B</h2>      <label style="font-size:0.75rem;">        <input type="checkbox" class="metricsToggle" data-panel="b" />        Metrics overlay      </label>    </div>    <div class="panel-controls">      <select class="fontSelect" data-panel="b">        <option value="monotalic">Monotalic Narrow</option>        <option value="monoflow">Monoflow</option>        <option value="pragmata">PragmataPro</option>        <option value="cartograph">Cartograph CF</option>        <option value="dankmono">Dank Mono Italic</option>      </select>      <div>        <input type="file" class="fileLoader" data-panel="b" accept=".md" />        <small>Load .md file</small>      </div>    </div>    <textarea class="mdInput" data-panel="b"># Panel BCompare fonts and spacing.</textarea>    <div class="preview" id="preview-b"></div>    <div class="tokens" id="tokens-b"></div>    <div class="token-editor">      <label>lh-body        <input type="text" data-panel="b" data-token="--lh-body" placeholder="1.55" />      </label>      <label>lh-heading        <input type="text" data-panel="b" data-token="--lh-heading" placeholder="1.22" />      </label>      <label>lh-code        <input type="text" data-panel="b" data-token="--lh-code" placeholder="1.48" />      </label>    </div>  </div>  <!-- PANEL C -->  <div class="panel" data-panel-root="c">    <div class="panel-header">      <h2>Panel C</h2>      <label style="font-size:0.75rem;">        <input type="checkbox" class="metricsToggle" data-panel="c" />        Metrics overlay      </label>    </div>    <div class="panel-controls">      <select class="fontSelect" data-panel="c">        <option value="monotalic">Monotalic Narrow</option>        <option value="monoflow">Monoflow</option>        <option value="pragmata">PragmataPro</option>        <option value="cartograph">Cartograph CF</option>        <option value="dankmono">Dank Mono Italic</option>      </select>      <div>        <input type="file" class="fileLoader" data-panel="c" accept=".md" />        <small>Load .md file</small>      </div>    </div>    <textarea class="mdInput" data-panel="c"># Panel CGreat for docs and notes.</textarea>    <div class="preview" id="preview-c"></div>    <div class="tokens" id="tokens-c"></div>    <div class="token-editor">      <label>lh-body        <input type="text" data-panel="c" data-token="--lh-body" placeholder="1.55" />      </label>      <label>lh-heading        <input type="text" data-panel="c" data-token="--lh-heading" placeholder="1.22" />      </label>      <label>lh-code        <input type="text" data-panel="c" data-token="--lh-code" placeholder="1.48" />      </label>    </div>  </div>  <!-- PANEL D -->  <div class="panel" data-panel-root="d">    <div class="panel-header">      <h2>Panel D</h2>      <label style="font-size:0.75rem;">        <input type="checkbox" class="metricsToggle" data-panel="d" />        Metrics overlay      </label>    </div>    <div class="panel-controls">      <select class="fontSelect" data-panel="d">        <option value="monotalic">Monotalic Narrow</option>        <option value="monoflow">Monoflow</option>        <option value="pragmata">PragmataPro</option>        <option value="cartograph">Cartograph CF</option>        <option value="dankmono">Dank Mono Italic</option>      </select>      <div>        <input type="file" class="fileLoader" data-panel="d" accept=".md" />        <small>Load .md file</small>      </div>    </div>    <textarea class="mdInput" data-panel="d"># Panel DFine-tune metrics and tokens.</textarea>    <div class="preview" id="preview-d"></div>    <div class="tokens" id="tokens-d"></div>    <div class="token-editor">      <label>lh-body        <input type="text" data-panel="d" data-token="--lh-body" placeholder="1.55" />      </label>      <label>lh-heading        <input type="text" data-panel="d" data-token="--lh-heading" placeholder="1.22" />      </label>      <label>lh-code        <input type="text" data-panel="d" data-token="--lh-code" placeholder="1.48" />      </label>    </div>  </div></div><details class="legend"><summary>Metrics Overlay Legend</summary>  <div class="legend-row">    <span class="swatch asc"></span> Ascender zone  </div>  <div class="legend-row">    <span class="swatch xh"></span> x‑height zone  </div>  <div class="legend-row">    <span class="swatch base"></span> Baseline  </div>  <div class="legend-row">    <span class="swatch desc"></span> Descender zone  </div></details><script>const fontSettings = {  monotalic: {    font: `"Monotalic-NarrowLight", "Monotalic-Narrow", monospace`,    body: 1.55, heading: 1.22, code: 1.48  },  monoflow: {    font: `"Monoflow", monospace`,    body: 1.52, heading: 1.18, code: 1.45  },  pragmata: {    font: `"PragmataPro", monospace`,    body: 1.62, heading: 1.25, code: 1.58  },  cartograph: {    font: `"Cartograph CF", monospace`,    body: 1.54, heading: 1.20, code: 1.50  },  dankmono: {    font: `"DankMono-Italic", monospace`,    body: 1.60, heading: 1.24, code: 1.56  }};function renderMarkdown(md) {  return md    .replace(/^```([\s\S]*?)```/gim, "<pre><code>$1</code></pre>")    .replace(/^### (.*$)/gim, "<h3>$1</h3>")    .replace(/^## (.*$)/gim, "<h2>$1</h2>")    .replace(/^# (.*$)/gim, "<h1>$1</h1>")    .replace(/^\> (.*$)/gim, "<blockquote>$1</blockquote>")    .replace(/\*\*(.+?)\*\*/gim, "<strong>$1</strong>")    .replace(/\*(.+?)\*/gim, "<em>$1</em>")    .replace(/`([^`]+)`/gim, "<code>$1</code>")    .replace(/^\- (.*$)/gim, "<ul><li>$1</li></ul>")    .replace(/^\d+\. (.*$)/gim, "<ol><li>$1</li></ol>")    .replace(/\n$/gim, "<br>");}function applyFont(panel, key) {  const f = fontSettings[key];  const panelEl = document.querySelector(`[data-panel-root="${panel}"]`);  panelEl.style.setProperty("--font-body", f.font);  panelEl.style.setProperty("--lh-body", f.body);  panelEl.style.setProperty("--lh-heading", f.heading);  panelEl.style.setProperty("--lh-code", f.code);  updateTokens(panel);}function updatePreview(panel) {  const input = document.querySelector(`textarea[data-panel="${panel}"]`);  const preview = document.getElementById(`preview-${panel}`);  preview.innerHTML = renderMarkdown(input.value);}function updateTokens(panel) {  const panelEl = document.querySelector(`[data-panel-root="${panel}"]`);  const tokens = document.getElementById(`tokens-${panel}`);  const styles = getComputedStyle(panelEl);  const font = styles.getPropertyValue("--font-body").trim();  const lhBody = styles.getPropertyValue("--lh-body").trim();  const lhHeading = styles.getPropertyValue("--lh-heading").trim();  const lhCode = styles.getPropertyValue("--lh-code").trim();  tokens.textContent =`Tokens for Panel ${panel.toUpperCase()}:--font-body: ${font}--lh-body: ${lhBody}--lh-heading: ${lhHeading}--lh-code: ${lhCode}`;}document.querySelectorAll(".fileLoader").forEach(loader => {  loader.addEventListener("change", e => {    const panel = e.target.dataset.panel;    const file = e.target.files[0];    if (!file) return;    const reader = new FileReader();    reader.onload = evt => {      const textarea = document.querySelector(`textarea[data-panel="${panel}"]`);      textarea.value = evt.target.result;      updatePreview(panel);    };    reader.readAsText(file);  });});document.querySelectorAll(".fontSelect").forEach(sel => {  sel.addEventListener("change", e => {    const panel = e.target.dataset.panel;    applyFont(panel, e.target.value);  });});document.querySelectorAll(".mdInput").forEach(area => {  area.addEventListener("input", e => {    updatePreview(e.target.dataset.panel);  });});document.querySelectorAll(".metricsToggle").forEach(box => {  box.addEventListener("change", e => {    const panel = e.target.dataset.panel;    const panelEl = document.querySelector(`[data-panel-root="${panel}"]`);    panelEl.classList.toggle("metrics-on", e.target.checked);  });});document.querySelectorAll(".token-editor input").forEach(input => {  input.addEventListener("change", e => {    const panel = e.target.dataset.panel;    const token = e.target.dataset.token;    const value = e.target.value.trim();    if (!value) return;    const panelEl = document.querySelector(`[data-panel-root="${panel}"]`);    panelEl.style.setProperty(token, value);    updateTokens(panel);  });});const fontSizeSlider = document.getElementById("fontSizeSlider");const fontSizeValue = document.getElementById("fontSizeValue");fontSizeSlider.addEventListener("input", e => {  const val = e.target.value + "px";  document.documentElement.style.setProperty("--base-font-size", val);  fontSizeValue.textContent = val;});const baselineToggle = document.getElementById("baselineToggle");baselineToggle.addEventListener("change", e => {  document.body.classList.toggle("baseline-on", e.target.checked);});["a","b","c","d"].forEach(p => {  updatePreview(p);  updateTokens(p);});</script></body></html>
