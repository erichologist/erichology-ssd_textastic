<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Font Lab: 4 Panels + Grid + Metrics + Tokens</title><style>:root {  --rainbow:repeating-linear-gradient(      to bottom,      transparent,       rgba(255, 100, 0, 0.25) 0%,      rgba(255, 0, 160, 0.25) 10%,      rgba(255, 0, 250, 0.25) 20%,       rgba(0, 50, 255, 0.25) 30%,      rgba(0, 100, 255, 0.25) 40%,      rgba(0, 255, 255, 0.25) 50%,      rgba(255, 255, 60, .25) 60%,      rgba(255, 255, 0, 0.25) 70%,      rgba(255, 105, 0, 0.25) 80%    );  --lg-drk:linear-gradient(      to bottom,      rgba(70, 70, 70, 0.25),      rgba(30, 30, 30, 0.45)    );    --rg-drk:radial-gradient(      rgba(0, 0, 0, 1),       rgba(50, 50, 50, 0)    );    --lg-dark:linear-gradient(      rgba(0, 0, 0, .9),      rgba(0, 0, 0, .7)    );	--cyn:color-mix(in oklab,#0F0 47%,#00F 53%);	--wtcyn:color-mix(in oklab,#fff 70%,var(--cyn) 30%);	--wcyn:color-mix(in oklab,var(--wtcyn) 47%,transparent 53%);	--c7n:color-mix(in srgb,var(--cyn) 70%,transparent 30%);	--sh-code:0 0 #fff,      0 0 1.64px #01202C80,						0 0 2px #fff2,           0 0 2px #003358,						0 0 3px var(--c7n),            0 0 3.4px #0001;	--code:var(--cyn);	--code:color-mix(in oklab,var(--cyn) 90%,transparent 10%);  --f-code:"Monotalic-NarrowLight", "Monotalic-Narrow", monospace;  --font-body: "Unica One", "Monotalic-NarrowLight", "Monotalic-Narrow", monospace;  --lh-body: 1.55;  --lh-heading: 1.22;  --lh-code: 1.48;  --base-font-size: 16px;  --bg: #111;  --fg: #fffA;  --f-label:Alfphabet-Condensed;  --panel-bg:rgba(255,255,255,.04);  --panel-border: #3330;  --accent: #4da3ff;  --sh-panel:inset 0 0 1.4px .25px #fff3,inset 0 0 8px #0004,inset 0 0 13px #fff1,inset 0 0 23px #fff2;}*,*::before,*::after {  box-sizing: border-box;}body {  margin: 0;  padding: 1rem;  background: var(--bg);  color: var(--fg);  font-family:var(--f-label);  line-height: var(--lh-body);  font-size: var(--base-font-size);  transition: background 0.2s ease;}body.baseline-on {  background-image: linear-gradient(    to bottom,    rgba(255,255,255,0.08) 1px,    transparent 1px  );  background-size: 100% 4px;}h1, h2, h3 {  line-height: var(--lh-heading);  font-family:var(--font-body);	font-style:normal !important;	font-weight:normal !important;  }/* Top controls */.top-controls {  display: flex;  flex-direction: column;  gap: 0.75rem;  margin-bottom: 1rem;  padding: 0.75rem;  border-radius: 10px;  background: #181818;  box-shadow:var(--sh-panel);}.top-controls-row {  display: flex;  flex-wrap: wrap;  gap: 1rem;  align-items: center;}.top-controls label {  font-size: 0.9rem;}input[type="range"] {  width: 180px;}/* Grid layout */.grid {  display: grid;  gap: 1rem;}.panel {  background: var(--panel-bg);  border: 1px solid var(--panel-border);  box-shadow:var(--sh-panel);  border-radius: 12px;  padding:1rem;  display: flex;  flex-direction: column;  gap: 0.75rem;  position: relative;  font-family:var(--f-label);}/* Panel controls */.panel-header {  display: flex;  justify-content: space-between;  align-items: center;  gap: 0.5rem;  font-family:var(--font-body);}.panel-header h2 {  margin: 0;  font-size: 1rem;}select,input[type="file"] {  width: 100%;  padding: 0.5rem;  border-radius: 8px;  background: #222;  color: #eee;  border: 1px solid #444;  font-size: 0.85rem;}.panel-controls {  display: grid;  grid-template-columns: 1.2fr 1fr;  gap: 0.5rem;  align-items: center;  font-family:var(--f-label);}.panel-controls small {  font-size: 0.75rem;  opacity: 0.8;}/* Markdown preview */.preview {  position: relative;  padding: 0.5rem 0;}.preview h1 { font-size: 1.6rem; margin: 1rem 0 0.5rem; }.preview h2 { font-size: 1.3rem; margin: 1rem 0 0.5rem; }.preview h3 { font-size: 1.1rem; margin: 1rem 0 0.5rem; }.preview p { margin: 0.5rem 0; }.preview blockquote {  border-left: 4px solid #555;  padding-left: 1rem;  margin: 0.8rem 0;  opacity: 0.9;  font-family:var(--f-label);}.preview ul,.preview ol {  margin: 0.5rem 0 0.5rem 1.2rem;  font-family:var(--f-label);}.preview code {  background: rgba(255,255,255,0.08);  padding: 0.2rem 0.4rem;  border-radius: 4px;  font-family:var(--f-code);}.preview pre {  background: rgba(255,255,255,0.05);  padding: 1rem;  border-radius: 8px;  overflow-x: auto;  line-height: var(--lh-code);  font-family:var(--f-code);}/* Metrics overlay */.panel.metrics-on .preview::before {  content: "";  font-family:var(--f-label);  inset: 0;  pointer-events: none;  background-image:    repeating-linear-gradient(      to bottom,      rgba(255, 0, 0, 0.25) 0,      rgba(255, 0, 0, 0.25) 10%,      transparent 10%,      transparent 30%,      rgba(0, 255, 0, 0.25) 30%,      rgba(0, 255, 0, 0.25) 60%,      transparent 60%,      transparent 70%,      rgba(0, 150, 255, 0.25) 70%,      rgba(0, 150, 255, 0.25) 72%,      transparent 72%,      transparent 85%,      rgba(255, 255, 0, 0.25) 85%,      rgba(255, 255, 0, 0.25) 100%    );  background-size: 100% 1.4em;}/* Textarea */textarea {  width: 100%;  height: 140px;  background: #313;  background-image:var(--lg-dark);  color: #eee;  border:none;  box-shadow:inset 0 0 55px #000, inset 0 5px 25px 10px #0006;  border-radius: 8px;  padding: 0.7rem;  font-family:var(--f-code);  font-weight:300;  font-style:normal;  line-height: var(--lh-body);  font-size: 0.9rem;}/* Token inspector + editor */.tokens {  background: #000;  background-image:var(--lg-drk);  border:none;  box-shadow:0 0 4px #0002,0 0 6px #3332, inset 0 5px 25px 10px #0006;  border-radius: 8px;  padding: 0.6rem;  font-size: 0.8rem;  line-height: 1.4;  font-weight:300;  font-style:normal;  color:var(--code);  text-shadow:var(--sh-code);  font-family:var(--f-code);  white-space: pre-wrap;}.token-editor {  display: grid;  grid-template-columns: repeat(3, 1fr);  gap: 0.4rem;  margin-top: 0.3rem;}.token-editor label {  font-size: 0.75rem;  display: flex;  flex-direction: column;  font-family:var(--f-label);}div.input{  border-radius: 6px;  display: block;  background: #2228;  border: none;  outline:none;  box-shadow:    inset 0 0 8px #0004,    inset 0 0 13px #0002,    inset 0 0 3.4px 1px #282828,    inset 0 0 23px #0002;  z-index: 100;  font-family:var(--f-code);}.token-editor input {  padding: 0.25rem;  border-radius: 6px;  border: none;  outline:none;  background: #4442;  color: #eee;  font-size: 0.75rem;  z-index: 8;  caret-color: #FF0080CC;  font-family:var(--f-code);  /*   mix-blend-mode:exclusion;  mix-blend-mode:overlay;  mix-blend-mode:difference;  mix-blend-mode:hard-light;  mix-blend-mode:screen;  mix-blend-mode:difference;*/}div.input:active,div.input:hover {  border-radius: 6px;  display: block;  background: #2228;  border: none;  outline:none;  box-shadow:     0 0 8px #0002,     0 0 13px #0022,     inset 0 0 3.4px 1px #08589880,     inset 0 0 6.4px  #08589822,          0 0 23px #0002;  z-index: 100;}.token-editor input:active,.token-editor input:hover {  border: none;  background: #0062;  outline:none;  z-index: 8;  color:#fff;  /*   mix-blend-mode:exclusion;  mix-blend-mode:overlay;  mix-blend-mode:difference;  mix-blend-mode:hard-light;  mix-blend-mode:screen;  mix-blend-mode:difference;*/}@media (min-width:300px) {  .panel {    border-radius:10px;    padding:1rem .8rem;    max-width:380px;    gap:0.5rem;  }  .grid {    max-width: 400px;    gap:1.5rem;  }  .token-editor {    max-width: 400px;  }  .token-editor label {    font-size: 0.55rem;  }    div.input{    border-radius: 5px;    margin: 0;  }  .token-editor input {    padding: 0.25rem 0rem 0.25rem 0.3rem;    padding-right: 0;    border-radius: 5px;    font-size: 96%;    gap:0;    margin: 0;  }}@media (min-width: 900px) {  .grid {    grid-template-columns: repeat(2, 1fr);  }  .token-editor label {    font-size: 0.75rem;    gap: 0.15rem;  }  div.input{    border-radius: 6px;  }  .token-editor input {    padding: 0.25rem;    border-radius: 6px;    margin: 0;    font-size: 0.75rem;  }}@media (min-width: 1400px) {  .grid {    grid-template-columns: repeat(4, 1fr);  }  .token-editor label {    font-size: 0.75rem;    gap: 0.15rem;  }  div.input{    border-radius: 8px;  }  .token-editor input {    padding: 0.25rem;    border-radius: 8px;    font-size: 0.75rem;  }}</style></head><body><div class="top-controls">  <div class="top-controls-row">    <label>      Font size scale:      <input id="fontSizeSlider" type="range" min="08" max="22" value="16" />      <span id="fontSizeValue">16px</span>    </label>  </div>  <div class="top-controls-row">    <label>      <input id="baselineToggle" type="checkbox" />      Baseline grid overlay (global)    </label>  </div></div><div class="grid">  <!-- PANEL A -->  <div class="panel" data-panel-root="a">    <div class="panel-header">      <h2>Panel A</h2>      <label style="font-size:0.75rem;">        <input type="checkbox" class="metricsToggle" data-panel="a" />        Metrics overlay      </label>    </div>    <div class="panel-controls">      <select class="fontSelect" data-panel="a">        <option value="monotalic">Monotalic-NarrowLight</option>        <option value="monoflow">Monoflow</option>        <option value="pragmata">PragmataPro</option>        <option value="cartograph">CartographCF-LightItalic</option>        <option value="dankmono">Dank Mono Italic</option>      </select>      <div>        <input type="file" class="fileLoader" data-panel="a" accept=".md" />        <small>Load .md file</small>      </div>    </div>    <textarea class="mdInput" data-panel="a"># Panel AType or load Markdown here.</textarea>    <div class="preview" id="preview-a"></div>    <div class="tokens" id="tokens-a"></div>    <div class="token-editor">      <label>lh-body        <div class="input">          <input type="text" data-panel="a" data-token="--lh-body" placeholder="1.55" />        </div>      </label>      <label>lh-heading        <div class="input">        <input type="text" data-panel="a" data-token="--lh-heading" placeholder="1.22" />        </div>      </label>      <label>lh-code        <div class="input">          <input type="text" data-panel="a" data-token="--lh-code" placeholder="1.48" />        </div>      </label>    </div>  </div>  <!-- PANEL B -->  <div class="panel" data-panel-root="b">    <div class="panel-header">      <h2>Panel B</h2>      <label style="font-size:0.75rem;">        <input type="checkbox" class="metricsToggle" data-panel="b" />        Metrics overlay      </label>    </div>    <div class="panel-controls">      <select class="fontSelect" data-panel="b">        <option value="monotalic">Monotalic-NarrowLight</option>        <option value="monoflow">Monoflow</option>        <option value="pragmata">PragmataPro</option>        <option value="cartograph">CartographCF-LightItalic</option>        <option value="dankmono">Dank Mono Italic</option>      </select>      <div>        <input type="file" class="fileLoader" data-panel="b" accept=".md" />        <small>Load .md file</small>      </div>    </div>    <textarea class="mdInput" data-panel="b"># Panel BCompare fonts and spacing.</textarea>    <div class="preview" id="preview-b"></div>    <div class="tokens" id="tokens-b"></div>    <div class="token-editor">      <label>lh-body        <div class="input">        <input type="text" data-panel="b" data-token="--lh-body" placeholder="1.55" />        </div>      </label>      <label>lh-heading        <div class="input">          <input type="text" data-panel="b" data-token="--lh-heading" placeholder="1.22" />        </div>      </label>      <label>lh-code        <div class="input">          <input type="text" data-panel="b" data-token="--lh-code" placeholder="1.48" />        </div>      </label>    </div>  </div>  <!-- PANEL C -->  <div class="panel" data-panel-root="c">    <div class="panel-header">      <h2>Panel C</h2>      <label style="font-size:0.75rem;">        <input type="checkbox" class="metricsToggle" data-panel="c" />        Metrics overlay      </label>    </div>    <div class="panel-controls">      <select class="fontSelect" data-panel="c">        <option value="monotalic">Monotalic-NarrowLight</option>        <option value="monoflow">Monoflow</option>        <option value="pragmata">PragmataPro</option>        <option value="cartograph">CartographCF-LightItalic</option>        <option value="dankmono">Dank Mono Italic</option>      </select>      <div>        <input type="file" class="fileLoader" data-panel="c" accept=".md" />        <small>Load .md file</small>      </div>    </div>    <textarea class="mdInput" data-panel="c"># Panel CGreat for docs and notes.</textarea>    <div class="preview" id="preview-c"></div>    <div class="tokens" id="tokens-c"></div>    <div class="token-editor">      <label>lh-body        <div class="input">        <input type="text" data-panel="c" data-token="--lh-body" placeholder="1.55" />        </div>      </label>      <label>lh-heading        <div class="input">        <input type="text" data-panel="c" data-token="--lh-heading" placeholder="1.22" />        </div>      </label>      <label>lh-code        <div class="input">        <input type="text" data-panel="c" data-token="--lh-code" placeholder="1.48" />        </div>      </label>    </div>  </div>  <!-- PANEL D -->  <div class="panel" data-panel-root="d">    <div class="panel-header">      <h2>Panel D</h2>      <label style="font-size:0.75rem;">        <input type="checkbox" class="metricsToggle" data-panel="d" />        Metrics overlay      </label>    </div>    <div class="panel-controls">      <select class="fontSelect" data-panel="d">        <option value="monotalic">Monotalic-NarrowLight</option>        <option value="monoflow">Monoflow</option>        <option value="pragmata">PragmataPro</option>        <option value="cartograph">CartographCF-LightItalic</option>        <option value="dankmono">Dank Mono Italic</option>      </select>      <div>        <input type="file" class="fileLoader" data-panel="d" accept=".md" />        <small>Load .md file</small>      </div>    </div>    <textarea class="mdInput" data-panel="d"># Panel DFine-tune metrics and tokens.</textarea>    <div class="preview" id="preview-d"></div>    <div class="tokens" id="tokens-d"></div>    <div class="token-editor">      <label>lh-body        <div class="input">          <input type="text" data-panel="d" data-token="--lh-body" placeholder="1.55" />        </div>      </label>      <label>lh-heading        <div class="input">          <input type="text" data-panel="d" data-token="--lh-heading" placeholder="1.22" />        </div>      </label>      <label>lh-code        <div class="input">          <input type="text" data-panel="d" data-token="--lh-code" placeholder="1.48" />        </div>      </label>    </div>  </div></div><script>const fontSettings = {  monotalic: {    font: `"Monotalic-NarrowLight", monospace`,    body: 1.55, heading: 1.22, code: 1.48  },  monoflow: {    font: `"Monoflow", monospace`,    body: 1.52, heading: 1.18, code: 1.45  },  pragmata: {    font: `"PragmataPro", monospace`,    body: 1.62, heading: 1.25, code: 1.58  },  cartograph: {    font: `"CartographCF-LightItalic", monospace`,    body: 1.54, heading: 1.20, code: 1.50  },  dankmono: {    font: `"DankMono-Italic", monospace`,    body: 1.60, heading: 1.24, code: 1.56  }};function renderMarkdown(md) {  return md    .replace(/^```([\s\S]*?)```/gim, "<pre><code>$1</code></pre>")    .replace(/^### (.*$)/gim, "<h3>$1</h3>")    .replace(/^## (.*$)/gim, "<h2>$1</h2>")    .replace(/^# (.*$)/gim, "<h1>$1</h1>")    .replace(/^\> (.*$)/gim, "<blockquote>$1</blockquote>")    .replace(/\*\*(.+?)\*\*/gim, "<strong>$1</strong>")    .replace(/\*(.+?)\*/gim, "<em>$1</em>")    .replace(/`([^`]+)`/gim, "<code>$1</code>")    .replace(/^\- (.*$)/gim, "<ul><li>$1</li></ul>")    .replace(/^\d+\. (.*$)/gim, "<ol><li>$1</li></ol>")    .replace(/\n$/gim, "<br>");}function applyFont(panel, key) {  const f = fontSettings[key];  const panelEl = document.querySelector(`[data-panel-root="${panel}"]`);  panelEl.style.setProperty("--font-body", f.font);  panelEl.style.setProperty("--lh-body", f.body);  panelEl.style.setProperty("--lh-heading", f.heading);  panelEl.style.setProperty("--lh-code", f.code);  updateTokens(panel);}function updatePreview(panel) {  const input = document.querySelector(`textarea[data-panel="${panel}"]`);  const preview = document.getElementById(`preview-${panel}`);  preview.innerHTML = renderMarkdown(input.value);}function updateTokens(panel) {  const panelEl = document.querySelector(`[data-panel-root="${panel}"]`);  const tokens = document.getElementById(`tokens-${panel}`);  const styles = getComputedStyle(panelEl);  const font = styles.getPropertyValue("--font-body").trim();  const lhBody = styles.getPropertyValue("--lh-body").trim();  const lhHeading = styles.getPropertyValue("--lh-heading").trim();  const lhCode = styles.getPropertyValue("--lh-code").trim();  tokens.textContent =`Tokens for Panel ${panel.toUpperCase()}:--font-body: ${font}--lh-body: ${lhBody}--lh-heading: ${lhHeading}--lh-code: ${lhCode}`;}document.querySelectorAll(".fileLoader").forEach(loader => {  loader.addEventListener("change", e => {    const panel = e.target.dataset.panel;    const file = e.target.files[0];    if (!file) return;    const reader = new FileReader();    reader.onload = evt => {      const textarea = document.querySelector(`textarea[data-panel="${panel}"]`);      textarea.value = evt.target.result;      updatePreview(panel);    };    reader.readAsText(file);  });});document.querySelectorAll(".fontSelect").forEach(sel => {  sel.addEventListener("change", e => {    const panel = e.target.dataset.panel;    applyFont(panel, e.target.value);  });});document.querySelectorAll(".mdInput").forEach(area => {  area.addEventListener("input", e => {    updatePreview(e.target.dataset.panel);  });});document.querySelectorAll(".metricsToggle").forEach(box => {  box.addEventListener("change", e => {    const panel = e.target.dataset.panel;    const panelEl = document.querySelector(`[data-panel-root="${panel}"]`);    panelEl.classList.toggle("metrics-on", e.target.checked);  });});document.querySelectorAll(".token-editor input").forEach(input => {  input.addEventListener("change", e => {    const panel = e.target.dataset.panel;    const token = e.target.dataset.token;    const value = e.target.value.trim();    if (!value) return;    const panelEl = document.querySelector(`[data-panel-root="${panel}"]`);    panelEl.style.setProperty(token, value);    updateTokens(panel);  });});const fontSizeSlider = document.getElementById("fontSizeSlider");const fontSizeValue = document.getElementById("fontSizeValue");fontSizeSlider.addEventListener("input", e => {  const val = e.target.value + "px";  document.documentElement.style.setProperty("--base-font-size", val);  fontSizeValue.textContent = val;});const baselineToggle = document.getElementById("baselineToggle");baselineToggle.addEventListener("change", e => {  document.body.classList.toggle("baseline-on", e.target.checked);});["a","b","c","d"].forEach(p => {  updatePreview(p);  updateTokens(p);});</script></body></html>
