<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Premium Animated Hero</title>    <style>        /* 1. GLOBAL SETTINGS & VARIABLES */        :root {            --bg-dark: #191919;            --bg-accent: #353130;            --bg-bridge: #2a2a2a;            --text-main: #ffffff;        }        body {            margin: 0;            padding: 0;            background-color: #111; /* Fallback */            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;            display: flex;            align-items: center;            justify-content: center;            min-height: 100vh;        }        /* 2. THE HERO CARD */        .hero-card {            width: 100%;            max-width: 75ch; /* Desktop limit */            margin: 1.5rem;            padding: 4rem 2rem;            border-radius: 24px;            overflow: hidden;            position: relative;            box-sizing: border-box;            text-align: center;                        /* Layered Animated Background */            background-image:                 linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 70%),                linear-gradient(90deg, var(--bg-dark), var(--bg-accent), var(--bg-bridge), var(--bg-dark));            background-size: 200% 100%, 400% 100%;            background-attachment: fixed;                        animation:                 shimmer 8s infinite linear,                 colorFlow 15s ease-in-out infinite;            border: 1px solid rgba(255, 255, 255, 0.1);            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);        }        /* 3. ANIMATION KEYFRAMES */        @keyframes shimmer {            0% { background-position: -200% 0, 0 0; }            100% { background-position: 200% 0, 0 0; }        }        @keyframes colorFlow {            0% { background-position: 0 0, 0% 50%; }            50% { background-position: 0 0, 101% 50%; } /* 101% hides seams */            100% { background-position: 0 0, 0% 50%; }        }        @keyframes fadeInUp {            from { opacity: 0; transform: translateY(20px); }            to { opacity: 1; transform: translateY(0); }        }        /* 4. CONTENT STYLES */        .fade-in-text {            opacity: 0;            animation: fadeInUp 0.8s ease-out forwards;            color: var(--text-main);        }        h1 {            font-size: 2.5rem;            margin-bottom: 1rem;            animation-delay: 0.2s;        }        p {            font-size: 1.1rem;            line-height: 1.6;            margin-bottom: 2rem;            opacity: 0.8;            animation-delay: 0.5s;        }        .cta-button {            display: inline-block;            padding: 0.8rem 2.5rem;            background: rgba(255, 255, 255, 0.1);            color: white;            text-decoration: none;            border-radius: 50px;            border: 1px solid rgba(255, 255, 255, 0.2);            font-weight: 600;            backdrop-filter: blur(10px);            -webkit-backdrop-filter: blur(10px);            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);            opacity: 0;            animation: fadeInUp 0.8s ease-out forwards;            animation-delay: 0.8s;        }        .cta-button:hover {            background: rgba(255, 255, 255, 0.2);            transform: translateY(-3px);            box-shadow: 0 10px 20px rgba(0,0,0,0.3);            border-color: rgba(255, 255, 255, 0.5);        }        .cta-button:active {            transform: scale(0.95);        }        /* 5. RESPONSIVE ADJUSTMENTS */        @media (max-width: 520px) {            h1 { font-size: 1.8rem; }            .hero-card { padding: 3rem 1.5rem; }        }    </style></head><body>    <section class="hero-card">        <h1 class="fade-in-text">Experience the Flow</h1>        <p class="fade-in-text">            This card uses a 75ch max-width for perfect readability on desktop,             while staying fully responsive on mobile devices.        </p>        <a href="#" class="cta-button">Get Started</a>    </section></body></html>
