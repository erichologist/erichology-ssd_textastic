<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Multi-Panel Font & Markdown Preview</title>	<link rel="stylesheet" type="text/css" media="all" href="../assets/mdbase.css"/>		<style>/* -------------------------------------------------------   BASE VARIABLES (default = Monotalic Narrow)------------------------------------------------------- */:root {	--w01:rgba(255,255,255,.01);	--sh-qt:0 4px 16px #0000001A,inset 0 2px 8px #FFF2,inset 0 0 18px #FFF4;	--qt-bg:var(--w01);  --font-body:"Monotalic-NarrowLight", "Monotalic-Narrow", monospace;	--monotalic:"Monotalic-NarrowLight", "Monotalic-Narrow", monospace;  --monoflow:"Monoflow", monospace;  --pragmata:"PragmataPro", monospace;  --cartograph:"Cartograph CF", monospace;  --dankmono:"DankMono-Italic", monospace;  --lh-body: 1.55;  --lh-heading: 1.22;  --lh-code: 1.48;	--code:#358AFFCC;	--sh-code:0 0 0 #00EEFF44,0 0 5px #0F07FF60,0 -0.1px 3.5px #00E95260,0 0 8px #5E60CE60,0 -1px 9px #0F07FF60,0 1px 8px #3457D560,0 0 4px #00D9E060,0 0 0.2em #FFF2,0 0 1px #FFF4,0 -1px 2px #FFF4,0 1px 2px #FFF4;  --bg: #111;	--bg:var(--bg-lg);  --fg:#eee;  --panel-bg:#181818;  --panel-border:#333;	--hr:linear-gradient(90deg, #999999, transparent);	--c-em:#FF0080DD;	--c-strong:var(--c-bold);	--c-boldem:#FF4167F1;	--c-embold:var(--c-boldem);	--c-bold:#647AFDCC;	--sh-bold:0 0 0 #0FC,0 0 .08em #04FC,0 0 .08em #00F8,1px -.5px .1em #06063880,		-1px .5px .1em #06063880;	--boldsh:var(--sh-bold);	--sh-em:0 0 #FF4167,0 0 .08em #D1002666,0 0 .1em #FF416780,0 0 .13em #000;	--emsh:var(--sh-em);	--sh-boldem: 0 0 0 #EF00B0,0 0 .08em #D1002680,0 0 .1em #EF00B066,0 0 .13em #220000FF;	--boldemsh:var(--sh-boldem);	--emboldsh:var(--sh-boldem);	--sh-hdcolor:0 0 0 #f50062,0 0 .08em #D1002666,0 0 .11em #FF416722,0 0 .13em #000C,0 0 .13em #f5006280;	--code:#0EFFEE;	--sh-code:0 0 3.4px #01202C,0 0 2px #00335880,0 0 3px var(--c7n),0 0 3.4px #000;	--bg-accent:#363434;	--bg-bridge:#242222;	--bg-drk:#191717;	--bg-dark:var(--bg-drk);	--hdmgnl:-2.75%;	--bg-lg:linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.025) 50%, rgba(255,255,255,0) 70%),linear-gradient(90deg, var(--bg-drk), var(--bg-accent), var(--bg-bridge), var(--bg-drk));	--anim:shimmer 8s infinite linear, colorFlow 15s ease-in-out infinite;	--bg-sz:200% 100%,400% 100%; --sz-bg:var(--bg-sz); 	--sh-panel:0 0 10px rgba(0,0,0,.4),-2px -2px 8px rgba(0,0,0,.12),1.5px 1px 15px #0006; 	--sh-qt-dark:	2px 1px 8px #0000004D,inset 3px 3px 30px #00000052,-2px -1px 6px #0000001C,0 0 18px #0000004D;	--bg-qt-dark:radial-gradient(circle at center, #000A 17%,#0006 100%);}/* -------------------------------------------------------   LAYOUT------------------------------------------------------- */body {  margin: 0;  padding: 1rem;  /*background: var(--bg);*/  color: var(--fg);  font-family: var(--font-body);  line-height: var(--lh-body);}h1, h2, h3 {  line-height: var(--lh-heading);}em,strong>em,strong,h1, h2, h3, h4, h5, h6{font-style:normal;font-weight:500 !important;}.container {  display: flex;  flex-direction: column;  gap: 1rem;}code{	color:var(--c-em);	text-shadow:var(--sh-em);	}strong{	color:var(--c-strong);	text-shadow:var(--sh-bold);}em {	color:var(--c-em);	text-shadow:var(--sh-em);}strong>em{	color:var(--c-boldem);	text-shadow:var(--sh-boldem);}@media (min-width: 900px) {  .container {    flex-direction: row;  }}.panel {  flex: 1;  background: var(--panel-bg);	background:var(--bg-qt-dark);	box-shadow:var(--sh-qt-dark);  border: 1px solid var(--panel-border);	border:none;  border-radius: 12px;  padding: 1rem;  display: flex;  flex-direction: column;  gap: 1rem;}/* -------------------------------------------------------   CONTROLS------------------------------------------------------- */.fontSelect,.panel>select {  width: 100%;  padding: 0.6rem;  border-radius: 8px;  background:none;	background-color:var(--w12);  color: #eee;  border: 1px solid #444;	border:none;	box-shadow:inset 0 0 2px #FFF,inset 0 0 8px #FFF, 0 0 2px #FFF, 0 0 8px #FFF !important;	}option,.fontSelect:active,.fontSelect:hover,.panel>select:active,.panel>select:hover {	box-shadow:inset 0 0 1px 10px #FFF,inset 0 0 5px #000,inset 0 0 8px #FFF !important;	background-color:var(--w05);	border:none !important;	outline:none;}/* -------------------------------------------------------   MARKDOWN PREVIEW STYLES------------------------------------------------------- */.preview {  padding: 0.5rem 0;}.preview h1 { font-size: 1.8rem; margin: 1rem 0 0.5rem; }.preview h2 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }.preview h3 { font-size: 1.2rem; margin: 1rem 0 0.5rem; }.preview p { margin: 0.5rem 0; }.preview blockquote {  border-left: 4px solid #555;  padding-left: 1rem;  margin: 0.8rem 0;  opacity: 0.9;}.preview ul, .preview ol {  margin: 0.5rem 0 0.5rem 1.2rem;}.preview code {  background: rgba(255,255,255,0.08);  padding: 0.2rem 0.4rem;  border-radius: 4px;}.preview pre {  background: rgba(255,255,255,0.05);  padding: 1rem;  border-radius: 8px;  overflow-x: auto;  line-height: var(--lh-code);}/* -------------------------------------------------------   TEXTAREA------------------------------------------------------- */textarea {  width: 100%;  height: 180px;  background: #000;  color: #eee;  border: 1px solid #444;  border-radius: 8px;  padding: 0.8rem;  font-family: var(--font-body);  line-height: var(--lh-body);}</style></head><body><h1>Multi-Panel Font Comparison + Markdown Preview</h1><div class="container">  <!-- PANEL 1 -->  <div class="panel">    <h2>Panel A</h2>    <select class="fontSelect" data-panel="a" style="box-shadow:inset 0 0 2px #FFF,inset 0 0 8px #FFF, 0 0 2px #FFF, 0 0 8px #FFF !important;">      <option value="monotalic">Monotalic Narrow</option>      <option value="monoflow">Monoflow</option>      <option value="pragmata">PragmataPro</option>      <option value="cartograph">Cartograph CF</option>      <option value="dankmono">Dank Mono Italic</option>    </select>    <textarea class="mdInput" data-panel="a"># Heading ASome sample text for **Panel A**.> A blockquote example.- List item- Another item    </textarea>    <div class="preview" id="preview-a"></div>  </div>  <!-- PANEL 2 -->  <div class="panel">    <h2>Panel B</h2>    <select class="fontSelect" data-panel="b">      <option value="monotalic">Monotalic Narrow</option>      <option value="monoflow">Monoflow</option>      <option value="pragmata">PragmataPro</option>      <option value="cartograph">Cartograph CF</option>      <option value="dankmono">Dank Mono Italic</option>    </select>    <textarea class="mdInput" data-panel="b"># Heading BDifferent text for **Panel B**.1. Ordered item2. Another item> Another quote.    </textarea>    <div class="preview" id="preview-b"></div>  </div></div><script>/* -------------------------------------------------------   FONT METRICS------------------------------------------------------- */const fontSettings = {  monotalic: {    font: `"Monotalic-NarrowLight", "Monotalic-Narrow", monospace`,    body: 1.55, heading: 1.22, code: 1.48  },  monoflow: {    font: `"Monoflow", monospace`,    body: 1.52, heading: 1.18, code: 1.45  },  pragmata: {    font: `"PragmataPro", monospace`,    body: 1.62, heading: 1.25, code: 1.58  },  cartograph: {    font: `"Cartograph CF", monospace`,    body: 1.54, heading: 1.20, code: 1.50  },  dankmono: {    font: `"DankMono-Italic", monospace`,    body: 1.60, heading: 1.24, code: 1.56  }};/* -------------------------------------------------------   SIMPLE MARKDOWN PARSER (lightweight)------------------------------------------------------- */function renderMarkdown(md) {  return md    .replace(/^### (.*$)/gim, "<h3>$1</h3>")    .replace(/^## (.*$)/gim, "<h2>$1</h2>")    .replace(/^# (.*$)/gim, "<h1>$1</h1>")    .replace(/^\> (.*$)/gim, "<blockquote>$1</blockquote>")    .replace(/\*\*(.*)\*\*/gim, "<strong>$1</strong>")    .replace(/\*(.*)\*/gim, "<em>$1</em>")    .replace(/`([^`]+)`/gim, "<code>$1</code>")    .replace(/```([\s\S]*?)```/gim, "<pre><code>$1</code></pre>")    .replace(/^\- (.*$)/gim, "<ul><li>$1</li></ul>")    .replace(/^\d+\. (.*$)/gim, "<ol><li>$1</li></ol>")    .replace(/\n$/gim, "<br>");}/* -------------------------------------------------------   UPDATE PANEL FONT + LINE-HEIGHT------------------------------------------------------- */function applyFont(panel, key) {  const f = fontSettings[key];  const panelEl = document.querySelector(`[data-panel="${panel}"]`).closest(".panel");  panelEl.style.setProperty("--font-body", f.font);  panelEl.style.setProperty("--lh-body", f.body);  panelEl.style.setProperty("--lh-heading", f.heading);  panelEl.style.setProperty("--lh-code", f.code);}/* -------------------------------------------------------   UPDATE MARKDOWN PREVIEW------------------------------------------------------- */function updatePreview(panel) {  const input = document.querySelector(`textarea[data-panel="${panel}"]`);  const preview = document.getElementById(`preview-${panel}`);  preview.innerHTML = renderMarkdown(input.value);}/* -------------------------------------------------------   EVENT LISTENERS------------------------------------------------------- */document.querySelectorAll(".fontSelect").forEach(sel => {  sel.addEventListener("change", e => {    const panel = e.target.dataset.panel;    applyFont(panel, e.target.value);  });});document.querySelectorAll(".mdInput").forEach(area => {  area.addEventListener("input", e => {    updatePreview(e.target.dataset.panel);  });});/* Initial render */updatePreview("a");updatePreview("b");</script></body></html>
