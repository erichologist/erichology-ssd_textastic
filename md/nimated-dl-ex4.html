<!DOCTYPE html><html lang="en"><head>	<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">	<title>Animated Definition List with Copy</title><link rel="stylesheet" type="text/css" media="all" href="../assets/mdmdmd.css"/><style>	body {		background-color: #323233;		color: #e0e0e0;	  font-family:'MrEavesSanOT-Light', 'MrEavesSanOT-Reg', sans-serif;		line-height: 1.6;		padding: 2em;	}h1, h2,h3,h3,h6 {	font-weight:normal;}	dl.accordion {		max-width: 700px;		margin: 0 auto;	}	.accordion .item {		border-bottom: 1px solid #000;		padding: 0.5em 0;	}	.accordion dt {		cursor: pointer;		color: #3695B0;		opacity: 100%;		color: #DCD7D4;		color: #009BC2;		font-variant:normal;		font-family:'MrEavesSanOT-Reg','MrEavesSanOT-Light',  sans-serif;		margin: 0;		outline: none;	}	.accordion dt:focus {	}	.accordion .item dd {		max-height: 0;		overflow: hidden;		transition: max-height 0.4s ease, opacity 0.4s ease;		opacity: 0;		margin: 0;		padding-left: 1em;	}	.accordion .item.open dd {		max-height: 200px;		opacity: 1;		margin-top: 0.5em;		color:#FFF;	}	.dd-wrapper {		display: flex;		align-items: flex-start;		gap: 0.5em;	}	.dd-text {		flex: 1;	}	.copy-btn {		border: none;		background:#00D9FF;		background-color:#00D9FF80;		background-image:linear-gradient(90deg,#202027F1,#202027,#202027F1);		border:1px solid #0000 !important;		border-color:#0000 !important;		border-radius:.5em !important;		box-shadow:0 0 3px hsla(223, 20%, 5%, .23),-1.2px .6px 4px hsla(223, 20%, 5%, .23),0 -1px 4px hsla(223, 20%, 5%, .20),inset 0 0 16px hsla(223, 20%, 26%, .1),0 1px 10px hsla(223, 20%, 1%, .28),0 0 8px #00D9FF1A !important;		text-shadow:0 0 0 #FFF,0 -1.2px 3.15px #3457D566,0 1.2px 3.15px #3457D544,0 0 3.2px #00FC,0 0 3.2px #0DF,0 0 3.2px #FFF8 !important;		color: #ccc;		color:#00D9FFCC !important;		cursor:pointer;		padding:.63em .26em !important;		margin-left:1.4em !important;		margin-top:1em !important;		margin-right:.85em !important;		min-width:10ch !important;		font-family:'Monoflow', 'Monotalic-NarrowLight', 'Monotalic-Narrow', monospace !important;		font-size:1em;		font-size:.8em !important;		line-height:.81 !important;		transition: background 0.3s;	}	.copy-btn:hover {		background:#161618;		background-color:#00D9FF;			background-image:linear-gradient(90deg,#16161880,#16161880,#16161880);		box-shadow:			inset 0 0 12px #0008,			inset 0 0 10px #00D9FF22,			inset 2px 1.5px 10px hsla(223, 10%, 45%, .36),			inset -2px -1.5px 12px hsla(223, 10%, 1%, .21),			inset 3px 2px 12px hsla(223, 10%, 1%, .21),			inset -3px -2px 12px hsla(223, 10%, 1%, .21),			inset -2px 2px 14px hsla(223, 10%, 0%, .11),			inset 2px 2px 14px hsla(223, 10%, 0%, .11),			 0 0 11px #00D9FF44			!important;		border:1px solid #0000 !important;		outline:none !important;		border-left:1px solid #0000 !important;		border-bottom:1px solid #0000 !important;		border-left:1px solid #0000 !important;		border-top:1px solid #0000 !important;		border-right:1px solid #0000 !important;		border-color:#0000 !important;		border:none !important;		color:#FFF8 !important;		font-weight:500;		text-shadow:0 0 5px #FFF8,0 0 3.2px #00FC,0 0 .3em #FFFC,0 0 4.2px #FFFC,0 0 0 #FFF6 !important;		font-family:'Monoflow', 'Monotalic-NarrowLight', 'Monotalic-Narrow', monospace !important;		font-size:.79em !important;		margin-right:.86em !important;	}	</style></head><body>	<h1>Animated Definition List with Copy</h1>	<dl class="accordion">	<div class="item">		<dt tabindex="0">HTML</dt>		<dd>		<div class="dd-wrapper">			<span class="dd-text">HTML is the standard markup language for web pages.</span>			<button class="copy-btn" aria-label="Copy definition">copy</button>		</div>		</dd>	</div>	<div class="item">		<dt tabindex="0">CSS</dt>		<dd>		<div class="dd-wrapper">			<span class="dd-text">CSS describes how HTML elements are displayed on screen or other media.</span>			<button class="copy-btn" aria-label="Copy definition">copy</button>		</div>		</dd>	</div>	</dl>	<script>	// Auto-close accordion behavior	document.querySelectorAll('.accordion dt').forEach(dt => {		dt.addEventListener('click', () => {		const currentItem = dt.parentElement;		document.querySelectorAll('.accordion .item').forEach(item => {			if (item !== currentItem) item.classList.remove('open');		});		currentItem.classList.toggle('open');		});		dt.addEventListener('keypress', e => {		if (e.key === 'Enter' || e.key === ' ') {			e.preventDefault();			dt.click();		}		});	});	// Copy-to-clipboard functionality	document.querySelectorAll('.copy-btn').forEach(button => {		button.addEventListener('click', () => {		const text = button.previousElementSibling.textContent;		navigator.clipboard.writeText(text).then(() => {			button.textContent = 'copied!';			setTimeout(() => button.textContent = '\u202Fcopy\u202F', 1500);		});		});	});	</script></body></html>
