<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Premium Animated Hero</title>    <style>        /* 1. GLOBAL SETTINGS & VARIABLES */        :root {            --bg-dark: #191919;            --bg-accent: #353130;            --bg-bridge: #2a2a2a;            --bg-dark: #191919;            --bg-accent: #746E6C;            --bg-bridge: #464342;            --text-main: #ffffff;            --bg-dark: #191919;            --bg-accent: #746E6C;            --bg-bridge: #FF0080;	--bg-lg4:linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.025) 50%, rgba(255,255,255,0) 70%),linear-gradient(90deg, var(--bg-drk), var(--bg-accent), var(--bg-bridge), var(--bg-drk));	--bg-lg3:linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.025) 50%, rgba(255,255,255,0) 70%),      linear-gradient(177deg, var(--bg-b), var(--bg-c), var(--bg-d), var(--bg-e), var(--bg-f), var(--bg-e), var(--bg-d), var(--bg-c), var(--bg-b));	--bg-lg2:linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.025) 50%, rgba(255,255,255,0) 70%),    linear-gradient(177deg, var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-d), var(--bg-e), var(--bg-d), var(--bg-c), var(--bg-b), var(--bg-a));	--bg-lg:linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0) 70%),    linear-gradient(177deg, var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-b), var(--bg-a));	--anim2:shimmer 8s infinite linear, colorFlow 15s ease-in-out infinite;	--anim:shimmer 8s infinite linear, colorFlow 15s ease-in-out infinite, lot 19s ease infinite;	--anim:shimmer 8s infinite linear, lot 19s ease infinite;	--bg-sz3:200% 100%, 400% 100%; --sz-bg:var(--bg-sz);	--bg-sz2:1800% 1800%;	--bg-sz:200% 100%, 1800% 1800%;}  .backdrop {    position: absolute;    inset: 0;    height: 200%;    border-radius: 4px;    background: hsl(0deg 0% 100% / 0.1);    pointer-events: none;    backdrop-filter: blur(16px);    -webkit-backdrop-filter: blur(16px);    mask-image: linear-gradient(      to bottom,      black 0,      black 50%,      transparent 50%    );    mask-image: linear-gradient(      to bottom,      white 0,      white 50%,      transparent 50%    );  }  .backdrop-edge {    /* Set this to whatever you want for the edge thickness: */    --thickness: 56px;    position: absolute;    inset: 0;    /*Only a few pixels will be visible, but we’ll      set the height by 100% to include nearby elements.    */    height: 100%;    /*Shift down by 100% of its own height, so that the      edge stacks underneath the main <header>:    */    transform: translateY(100%);    background: hsl(0deg 0% 100% / 0.1);    backdrop-filter: blur(8px) brightness(120%);    -webkit-backdrop-filter: blur(8px) brightness(120%);    pointer-events: none;    /*We mask out everything aside from the first few      pixels, specified by the --thickness variable:    */    mask-image: linear-gradient(      to bottom,      black 0,      black var(--thickness),      transparent var(--thickness)    );    mask-image: linear-gradient(      to bottom,      white 0,      white var(--thickness),      transparent var(--thickness)    );  }header>h1 { display: block;margin: 1rem;color:white;}        body {    margin: 0;    padding: 0;    background-color: #111; /* Fallback */    background-image:         linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.405) 50%, rgba(255,255,255,0) 70%),        linear-gradient(90deg, var(--bg-dark), var(--bg-accent), var(--bg-bridge), var(--bg-dark));    background-image:         linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.405) 50%, rgba(255,255,255,0) 70%),        linear-gradient(177deg, var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-b), var(--bg-a));        /* 3. The Animations */    animation:        shimmer 8s infinite linear,        colorFlow 15s ease-in-out infinite,        lot 19s ease infinite;    background-size:200% 100%, 400% 100%;    background-size:200% 100%, 1800% 1800%;    background-attachment:fixed;    /* 4. Glass Effect (Optional) */    border: 1px solid rgba(255, 255, 255, 0);    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),inset 0 0 12px  rgba(255,255,255,0.2),inset 0 0 1px .2px rgba(255,255,255,0.5);    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;    /*display: flex;    align-items: center;    justify-content: center;*/    min-height: 100vh;}/*========= *//* The Container for your section */.hero-card {    /* 1. Dimensions & Constraints */    width: 100%;    max-width: 75ch;    margin: 2rem auto;    padding: 4rem 2rem;    border-radius: 24px;    overflow: hidden; /* Clips the gradient and shimmer to the corners */    position: relative;    box-sizing: border-box;    /* 2. The Animated Background Layers */    background-image:         linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 70%),        linear-gradient(90deg, #191919, #353130, #2a2a2a, #191919);    background-size: 200% 100%, 400% 100%;        /* 3. The Animations */    animation:         shimmer 8s infinite linear,         colorFlow 15s ease-in-out infinite;        /* 4. Glass Effect (Optional) */    border: 1px solid rgba(255, 255, 255, 0);    box-shadow: 0 20px 40px rgba(0,0,0,0.4);    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),inset 0 0 12px  rgba(255,255,255,0.2),inset 0 0 1px .2px rgba(255,255,255,0.5);}/* 2. THE HERO CARD */.hero-card {    width: 100%;    max-width: 75ch; /* Desktop limit */    margin: 1.5rem;    padding: 4rem 2rem;    border-radius: 24px;    overflow: hidden;    position: relative;    box-sizing: border-box;    text-align: center;    /* 2. The Animated Background Layers */    background-image:         linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.405) 50%, rgba(255,255,255,0) 70%),        linear-gradient(90deg, var(--bg-dark), var(--bg-accent), var(--bg-bridge), var(--bg-dark));    background-size: 200% 100%, 400% 100%;        /* 3. The Animations */    animation:         shimmer 8s infinite linear,         colorFlow 15s ease-in-out infinite;    background-size: 200% 100%, 400% 100%;    background-attachment: fixed;    /* 4. Glass Effect (Optional) */    border: 1px solid rgba(255, 255, 255, 0);    box-shadow: 0 20px 40px rgba(0,0,0,0.4);    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),inset 0 0 12px  rgba(255,255,255,0.2),inset 0 0 1px .2px rgba(255,255,255,0.5);}/* Ensure the text inside is readable */.hero-card h1, .hero-card p {    margin: 0;    color: #ffffff;    text-shadow: 0 2px 4px rgba(0,0,0,0.3);}              /* 4. CONTENT STYLES *//* Base class for elements we want to animate */.fade-in-text {    opacity: 0; /* Start hidden */    animation: fadeInUp 0.8s ease-out forwards;}.fade-in-text {    opacity: 0;    animation: fadeInUp 0.8s ease-out forwards;    color: var(--text-main);}h1 {    font-size: 2.5rem;    margin-bottom: 1rem;    animation-delay: 0.2s;}p {    font-size: 1.1rem;    line-height: 1.6;    margin-bottom: 2rem;    opacity: 0.8;    animation-delay: 0.5s;}.cta-button {    display: inline-block;    margin-top: 1.5rem;    padding: 0.8rem 2rem;    background: rgba(255, 255, 255, 0.1); /* Semi-transparent */    color: rgba(255, 255, 255, 0.9);    text-decoration: none;    border-radius: 50px;    border: 1px solid rgba(255, 255, 255, 0.2);    font-weight: bold;    backdrop-filter: blur(10px); /* The "Glass" effect */    -wenkit-backdrop-filter: blur(10px); /* The "Glass" effect */    transition: all 0.3s ease;    cursor: pointer;        /* Animation: It follows the same fade-in as the text */    opacity: 0;    animation: fadeInUp 0.8s ease-out forwards;    animation-delay: 0.8s; /* Appears last */}.cta-button {    display: inline-block;    padding: 0.8rem 2.5rem;    background: rgba(255, 255, 255, 0.1);    color: rgba(255, 255, 255, 0.9);    text-decoration: none;    border-radius: 50px;    border: 1px solid rgba(255, 255, 255, 0.2);    font-weight: 600;    backdrop-filter: blur(10px);    -webkit-backdrop-filter: blur(10px);    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);    opacity: 0;    animation: fadeInUp 0.8s ease-out forwards;    animation-delay: 0.8s;}.cta-button:hover {    background: rgba(255, 255, 255, 0.2);    transform: translateY(-3px); /* Lifts up slightly */    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); /* Soft outer glow */    border-color: rgba(255, 255, 255, 0.5);}.cta-button:active {    transform: scale(0.95); /* Shrinks slightly when tapped */    background: rgba(255, 255, 255, 0.3);}/* 3. ANIMATION KEYFRAMES */@keyframes colorFlow {    0% { background-position: 0 0, 0% 50%; }    50% { background-position: 0 0, 101% 50%; } /* 101% hides seams */    100% { background-position: 0 0, 0% 50%; }}@keyframes colorFlow {    0% { background-position: -200% 0, 0% 50%; }    50% { background-position: 0 0, 101% 50%; } /* 101% hides seams */    100% { background-position: 200% 0, 0% 50%; }}@keyframes shimmer {    0% { background-position: -200% 0, 0 0; }    50% { background-position: 0 0, 0 0; } /* 101% hides seams */    100% { background-position: 200% 0, 0 0; }}/* The Animation Keyframes */@keyframes fadeInUp {    from {        opacity: 0;        transform:translateY(20px);    }    to {        opacity: 1;        transform:translateY(0);    }}/* Staggered Delays */.delay-1 { animation-delay: 0.2s; }.delay-2 { animation-delay: 0.5s; }/* 5. RESPONSIVE ADJUSTMENTS */@media (max-width: 520px) {    h1 { font-size: 1.8rem; }    .hero-card { padding: 3rem 1.5rem; }}</style></head><body><header>  <div class="backdrop"></div><h1>  H E A D E R</h1>  <div class="backdrop-edge"></div></header><br><br><br>    <section class="hero-card">        <h1 class="fade-in-text">Experience the Flow</h1>        <p class="fade-in-text">            This card uses a 75ch max-width for perfect readability on desktop,             while staying fully responsive on mobile devices.        </p>        <a href="#" class="cta-button">Get Started</a>    </section></body></html>
