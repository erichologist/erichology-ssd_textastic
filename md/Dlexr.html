<!DOCTYPE HTML><html>    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico"><link rel="icon" type="image/png" href="../assets/icons/favicon.png"><link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png"><link rel="manifest" href="../assets/icons/site.webmanifest"><meta name="apple-mobile-web-app-title" content="erichology"><title>title | main_site</title><script type="text/javascript" src="../assets/prism.js"></script><link rel="stylesheet" type="text/css" media="all" href="../assets/prism.css"/><link rel="stylesheet" type="text/css" media="all" href="../assets/mdprag.css"/><style>html {    width: 100%;    height: 100%;    margin: 0;}body {    background: #262628;    background-color: #262628;    color: #E8E0E0;}#flex-container {  border: 2px dashed gray;  display: flex;}#flex-auto {  cursor: pointer;  background-color: wheat;  flex: auto;}#default {  background-color: lightblue;}/* Keyword value */.none{flex: none;} /* 0 0 auto *//* One value, unitless number: flex-growflex-basis is then equal to 0%. */.grow2{flex: 2;} /* 2 1 0% *//* One value, width/height: flex-basis */.basis-auto {flex: auto;} /* 1 1 auto */.basis-10em {flex: 10em;} /* 1 1 10em */.basis-30p {flex: 30%;}.basis-min-content {flex: min-content;}/* Two values: flex-grow | flex-basis */.grow1-basis30px {flex: 1 30px;} /* 1 1 30px *//* Two values: flex-grow | flex-shrink */.grow2-shrink2 {flex: 2 2;} /* 2 2 0% *//* Three values: flex-grow | flex-shrink | flex-basis */.grow2-shrink2-basis10p {flex: 2 2 10%;}/* Global values */.basis-auto {flex: inherit;}.basis-auto {flex: initial;} /* 0 1 auto */.basis-auto {flex: revert;}.basis-auto {flex: revert-layer;}.basis-auto {flex: unset;}</style><script>const flexAutoItem = document.getElementById("flex-auto");const defaultItem = document.getElementById("default");flexAutoItem.addEventListener("click", () => {  defaultItem.style.display =    defaultItem.style.display === "none" ? "block" : "none";});</script></head><body><h1>title</h1><h2>main_site</h2><div id="flex-container">  <div id="flex-auto">    flex: auto (click to remove/add the `flex: initial` box)  </div>  <div id="default">flex: initial</div></div> </body></html><!-- EDFEF038-6F7A-4929-9A4A-B295ACD017CA -->
