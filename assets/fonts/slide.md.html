<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style> * { box-sizing: border-box; }body { font-family: sans-serif;             background: #222;}.mySlides { display: none;}img {	padding-botom: -5em;    border-radius: 6px;    vertical-align: middle;	margin-botom: -5em;}/* Slideshow container */.slideshow-container {	max-width: 50%;	position: relative;	margin: auto;	margin-botom: -5em;	padding-botom: -5em;}/* Caption text */.text {	color: #f2f2f2;	font-size: 15px;	padding: 8px 12px;	position: absolute;	bottom: 8px;	width: 100%;	text-align: center;}/* Number text (1/3 etc) */.numbertext {	color: #f2f2f2;	opacity: .7;	font-size: 5px;	padding: 8px/* 12px*/;	position: absolute;	top: 0;}/* The dots/bullets/indicators */.dot {	height:5px;	width:5px;	margin: 0 1.5px;	margin-top: -5em;	padding-top: -5em;	background-color: #bbb;	border-radius: 50%;	display: inline-block;	transition: background-color 2s ease;}.active { background-color: #717171; }/* Fading animation */.fade {	animation-name: fade;	animation-duration: 2s;}@keyframes fade {	from {		opacity: .2}to {	opacity: 1	}}/* On smaller screens, decrease text size */@media only screen and (max-width: 300px) {	.text {		font-size: 11px	}}</style></head><body><div class="slideshow-container">  <div class="mySlides fade">    <div class="numbertext">1 / 4</div>    <img src="https://assets.fonts.adobe.com/400x200/9el4wk3nh8dg0ga37b4s8lc9qx2e" style="width:100%">    <div class="text"></div>  </div>  <div class="mySlides fade">    <div class="numbertext">2 / 4</div>    <img src="https://assets.fonts.adobe.com/400x200/0pscok4e0uscp7uxizxvosa7qlql" style="width:100%">    <div class="text"></div>  </div>  <div class="mySlides fade">    <div class="numbertext">3 / 4</div>    <img src="https://assets.fonts.adobe.com/400x200/29ocu54p7dssbqa0rq94t2qqaado" style="width:100%">    <div class="text"></div>  </div>  <div class="mySlides fade">    <div class="numbertext">4 / 4</div>    <img src="https://assets.fonts.adobe.com/400x200/yspnkqvjgjap7f7tt2u9ntst8fxp" style="width:100%">    <div class="text"></div>  </div></div><br><div style="margin-top: -10%; padding-top:0px;padding-bottom:0px;text-align:center"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><script>let slideIndex = 0;	showSlides();	function showSlides() {	let i;	let slides = document.getElementsByClassName("mySlides");	let dots = document.getElementsByClassName("dot");	for (i = 0;	i < slides.length;	i++) {	slides[i].style.display = "none";}slideIndex++;	if (slideIndex > slides.length) {	slideIndex = 1}for (i = 0;	i < dots.length;	i++) {	dots[i].className = dots[i].className.replace(" active", "");}slides[slideIndex-1].style.display = "block";	dots[slideIndex-1].className += " active";	setTimeout(showSlides, 2000);	// Change image every 2 seconds}</script><!-- <img src="https://assets.fonts.adobe.com/400x200/9el4wk3nh8dg0ga37b4s8lc9qx2e" alt="Dico Mono Typeface" ><img src="https://assets.fonts.adobe.com/400x200/0pscok4e0uscp7uxizxvosa7qlql" alt="Dico Mono Typeface" ><img src="https://assets.fonts.adobe.com/400x200/29ocu54p7dssbqa0rq94t2qqaado" alt="Dico Mono Typeface" ><img src="https://assets.fonts.adobe.com/400x200/5djn7fe2ik5e795f52hkk2bb4y2q" alt="Dico Mono Typeface" ><img src="https://assets.fonts.adobe.com/400x200/yspnkqvjgjap7f7tt2u9ntst8fxp" alt="Dico Mono Typeface" > --></body></html>
