<!DOCTYPE html><html><head>    <meta name="viewport" content="width=device-width, initial-scale=1"><style>        * {            box-sizing: border-box        }        body {            font-family: sans-serif;            background: #222;            margin: 0        }        .mySlides {            display: none        }        img {            border-radius: 9px;            vertical-align: middle;        }        /*Slideshow container*/        .slideshow-container {            max-width: 220px;            position: relative;            margin: auto;        	margin-top: 1em;	}        /*Next & previous buttons*/        .prev, .next {            cursor: pointer;            position: absolute;            top: 50%;            width: auto;            padding: 8px;            margin-top: -11px;            color: #ddd;            font-weight: bold;            font-size: 9px;            transition: 0.6s ease;            border-radius: 0 3px 3px 0;            user-select: none;        }        /*Position the "next button" to the right*/        .next {            right: 0;            border-radius: 3px 0 0 3px;        }        /*On hover, add a black background color with a little bit see-through*/        .prev:hover, .next:hover {            background-color: rgba(0, 0, 0, 0.18);        }.next::after{  content:"\276f";}.prev::after{  content:"\276e";}        /*Caption text*/        .text {            color: #f2f2f2;            font-size: 15px;            padding: 8px 12px;            position: absolute;            bottom: 8px;            width: 100%;            text-align: center;        }        /*Number text (1/4 etc)*/        .numbertext {            color: #f2f2f2;            font-size: 12px;            padding: 8px 12px;            position: absolute;            top: 0;            opacity: 0%;        }        /*The dots/bullets/indicators*/        .dot {            cursor: pointer;            height: 9px;            width: 9px;            margin: 0 4.5px;            background-color: #bbb;            border-radius: 50%;            display: inline-block;            transition: background-color 0.6s ease;        }        /*.active, */.dot:hover {            background-color: #717171;        }        .active {            background-color: #71717180;}        /*Fading animation*/        .fade {            animation-name: fade;            animation-duration: 2.5s;        }@keyframes fade {            from { opacity: .01}            to { opacity: .8}        }        /*On smaller screens, decrease text size*/@media only screen and (max-width: 160px) {            .prev, .next, .text {font-size: 8px}        }</style></head><body>    <div class="slideshow-container">        <div class="mySlides fade">            <div class="numbertext">1 / 4</div>            <img src="https://assets.fonts.adobe.com/400x200/9el4wk3nh8dg0ga37b4s8lc9qx2e" style="width:100%">        </div>        <div class="mySlides fade">            <div class="numbertext">2 / 4</div>            <img src="https://assets.fonts.adobe.com/400x200/0pscok4e0uscp7uxizxvosa7qlql" style="width:100%">        </div>        <div class="mySlides fade">            <div class="numbertext">3 / 4</div>            <img src="https://assets.fonts.adobe.com/400x200/29ocu54p7dssbqa0rq94t2qqaado" style="width:100%">        </div>        <div class="mySlides fade">            <div class="numbertext">4 / 4</div>            <img src="https://assets.fonts.adobe.com/400x200/yspnkqvjgjap7f7tt2u9ntst8fxp" style="width:100%">        </div>        <a class="prev" onclick="plusSlides(-1)"></a><a class="next" onclick="plusSlides(1)"></a>    </div>    <br>    <div style="margin-top: -1em;text-align:center">        <span class="dot" onclick="currentSlide(1)"></span>        <span class="dot" onclick="currentSlide(2)"></span>        <span class="dot" onclick="currentSlide(3)"></span>        <span class="dot" onclick="currentSlide(4)"></span>    </div>    <script>let slideIndex = 1; showSlides(slideIndex); function plusSlides(n) { showSlides(slideIndex += n);} function currentSlide(n) { showSlides(slideIndex = n);} function showSlides(n) { let i; let slides = document.getElementsByClassName("mySlides"); let dots = document.getElementsByClassName("dot"); if (n > slides.length) {                slideIndex = 1 } if (n < 1) {                slideIndex = slides.length } for (i = 0; i < slides.length; i++) {                slides[i].style.display = "none"; } for (i = 0; i < dots.length; i++) {                dots[i].className = dots[i].className.replace(" active", ""); } slides[slideIndex-1].style.display = "block"; dots[slideIndex-1].className += " active"; }    </script></body></html>
