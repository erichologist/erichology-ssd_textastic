 <svg title="xor" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 200 150" xml:space="preserve"><defs><filter id="xor-filter"><feImage href="#shape1" result="in1" x="10" y="10" width="100" height="100"/><feImage href="#shape2" result="in2" x="50" y="50" width="100" height="100"/><feComposite in="in1" in2="in2" operator="screen" result="composite-result"/><feImage href="#composite-result" width="200" height="150"/></filter><circle id="shape1" cx="60" cy="60" r="50" fill="red"/><rect id="shape2" x="50" y="50" width="100" height="100" fill="blue"/></defs><rect width="100%" height="100%" filter="url(#xor-filter)"/></svg>