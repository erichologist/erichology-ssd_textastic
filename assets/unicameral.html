<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8">  <meta name="viewport" content="  width=device-width,  initial-scale=1.0">  <title>UNICA_OS // SYNTHWAVE_84</title>  <link rel="preconnect" href="    https://fonts.googleapis.com">  <link rel="preconnect" href="    https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Unica+One&display=swap" rel="stylesheet"><style>:root {  --bg-color: #101014;  --surface: #24242e;  --neon-pink: #f92aad;  --neon-cyan: #3fe4ef;  --text-yellow: #fff5b1;  --glow-pink: 0 0 10px rgba(249, 42, 173, 0.8);  --glow-cyan: 0 0 10px rgba(63, 228, 239, 0.8);}* {  margin: 0;  padding: 0;   box-sizing: border-box;}body {  background-color:var(--bg-color);  background-image:linear-gradient(to bottom, #1a1a21 0%, #050505 100%);  color: white;  font-family:'Unica One', sans-serif;  overflow: hidden;    /* Keeps the grid from scrolling */  width: 100vw;  height: 100vh;  display: flex;  flex-direction:column;}/* --- BACKGROUND GRID --- */.grid-floor {  position: fixed;  bottom: -10%;  left: 50%;  width: 200%;  height: 100vh;  margin-left: -100%;  background-image:linear-gradient(var(--neon-pink) 1px, transparent 1px), linear-gradient(90deg,var(--neon-pink) 1px,transparent 1px);  background-size:60px 60px;  transform:perspective(400px) rotateX(60deg);  transform-origin:center bottom;  filter:drop-shadow(0 0 5px var(--neon-pink));  opacity:0.15;  z-index:0;  animation:grid-travel 2s infinite linear;}@keyframes grid-travel {    from { background-position:0 0; }    to { background-position:0 60px; }}/* --- NAVIGATION --- */nav {  background:rgba(31, 31, 41, 0.9);  height: 70px;  display: flex;  justify-content:space-between;  align-items: center;  padding: 0 50px;  border-bottom: 2px solid #333;  backdrop-filter:blur(10px);  -webkit-backdrop-filter:blur(10px);  z-index: 10;}.logo {  font-size:1.8rem;  letter-spacing: 4px;  color:white;  text-shadow:var(--glow-cyan);  position: relative;}.nav-links {  display: flex;  list-style: none;  gap: 30px;}.nav-links a {  text-decoration:none;  color: #888;  letter-spacing: 2px;  transition: 0.3s;  position: relative;  padding: 10px 0;}.nav-links a:hover,.nav-links a.active {  color: white;  text-shadow:var(--glow-pink);}.nav-links a::after {  content: '';  position: absolute;  bottom: 0;  left: 0;  width: 0;  height: 2px;  background: var(--neon-pink);  box-shadow: var(--glow-pink);  transition: 0.3s;}.nav-links a:hover::after,.nav-links a.active::after {  width: 100%;  width: 70%;}/* --- TERMINAL --- */main {  flex: 1;  display: flex;  justify-content: center;  align-items: center;  z-index: 5;}.terminal {  width: 700px;  width: 400px;  background: var(--surface);  border-radius: 8px;  border: 1px solid #444;  box-shadow: 0 0 40px rgba(0,0,0,0.7);  overflow: hidden;  overflow: auto;  position: relative;}/* Scanline Overlay */.terminal::after {  content: " ";  position: absolute;  top: 0;  left: 0;  bottom: 0;  right: 0;  background:linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);  background-size:100% 4px;  z-index: 10;  pointer-events: none;}.terminal-bar {  background: #1a1a21;  padding: 10px 15px;  display: flex;  gap: 8px;}.dot {  width: 12px;  height: 12px;  border-radius: 50%; }.r { background: #ff5f56; }.y { background: #ffbd2e; }.g { background: #27c93f; }.content {  padding: 30px;  height: 300px;  font-family:'JetBrains Mono', monospace;  /* LIGATURES SUPPORT */  font-size: 1.1rem;  color: var(--text-yellow);  line-height: 1.6;  font-variant-ligatures: normal;  text-shadow:0 0 2px rgba(255, 245, 177, 0.3);  overflow-y:auto;}.prompt {  color: var(--neon-pink);  text-shadow: var(--glow-pink);}.cyan {  color: var(--neon-cyan);  text-shadow: var(--glow-cyan);}.cursor {  display: inline-block;  width: 10px; height: 1.2rem;  background: var(--neon-cyan);  margin-left: 5px;  animation: blink 0.8s infinite;}@keyframes blink { 50% { opacity: 0; } }</style></head><body><div class="grid-floor"></div><nav>    <div class="logo">UNICA_OS</div>    <ul class="nav-links">        <li><a href="#" class="active">DASHBOARD</a></li>        <li><a href="#">NEURAL_LINK</a></li>        <li><a href="#">DATABASE</a></li>        <li><a href="#">ENCRYPT</a></li>    </ul></nav>  <main>    <div class="terminal">        <div class="terminal-bar">            <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>        </div>        <div id="typewriter" class="content"></div>    </div>  </main><script>    const target = document.getElementById('typewriter');    const lines = [        "> INITIALIZING RETRO_DRIVE...",        "> LOADING LIGATURES: [ =>, !=, === ]",        "> ESTABLISHING NEON_CONNECTION...",        "> STATUS: SYSTEM_CRITICAL_AESTHETIC",        "> WELCOME TO THE GRID, OPERATOR."    ];    let lineIdx = 0;    let charIdx = 0;    let currentHTML = "";    function type() {        if (lineIdx < lines.length) {            if (charIdx < lines[lineIdx].length) {                let char = lines[lineIdx].charAt(charIdx);                currentHTML += char;                // Style the prompt on the fly                let displayHTML = currentHTML.replace("> ", '<span class="prompt">> </span>');                target.innerHTML = displayHTML + '<span class="cursor"></span>';                charIdx++;                setTimeout(type, 40);            } else {                currentHTML += "<br>";                lineIdx++;                charIdx = 0;                setTimeout(type, 500);            }        }    }    window.onload = type;</script></body></html>
